[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wound-ontology"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "google-genai",
    "anthropic",
    "openai",
    "biopython",
    "owlready2",
    "concepts",
    "pandas",
    "pydantic>=1,<3",
    "python-dotenv",
    "networkx",
    "rdflib",
    "torch>=2.2,<2.3",       # last release with macOS x86_64 wheels
    "numpy<2",               # torch 2.2.2 is built against the NumPy 1.x C API
    "transformers>=4.40,<5", # transformers 5 needs torch>=2.5 and silently
                             # disables PyTorch below it; see requirements.txt
    "scikit-learn",
    "rapidfuzz",
    "pytest-asyncio",
    "pyvis",
    "deeponto",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests as integration tests (requires API keys and network)",
    "reasoner: marks tests that shell out to ROBOT/ELK (slow, needs robot on PATH)",
]
