        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000466
        title: "Angiopathy"
        description: "A pathological disorder consisting in an abnormal structure of the wall or of the lumen of one or more blood vessels, such that perfusion of the tissue those vessels supply is reduced."
      DIABETIC_METABOLIC_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000467
        title: "Diabetic metabolic disorder"
        description: "A pathological disorder consisting in the abnormal organisation of the insulin-secreting or insulin-responsive tissues of a patient, such that glucose homeostasis is not maintained."
      VENOUS_INSUFFICIENCY_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000468
        title: "Venous insufficiency disorder"
        description: "A pathological disorder consisting in an abnormal structure of the valves or walls of the veins of a limb, such that venous return from that limb against gravity is impaired."
      AUTOIMMUNE_TISSUE_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000469
        title: "Autoimmune tissue disorder"
        description: "A pathological disorder consisting in tissue of a patient that has been damaged by an immune response directed against constituents normally present in that patient's own body."
      LYMPHOCELE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000470
        title: "Lymphocele"
        description: "A pathological disorder consisting in a collection of lymphatic fluid within a non-epithelialised cavity in a bodily structure."
      ABSCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000472
        title: "Abscess"
        description: "A pathological disorder consisting in a localised collection of purulent material within a bodily structure, surrounded by inflamed and granulating tissue."
      MUCOSAL_BLISTER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000473
        title: "Mucosal blister"
        description: "A pathological disorder consisting in a fluid-filled separation of the epithelium of a mucous membrane from the tissue beneath it."
