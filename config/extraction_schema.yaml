      FIXED_DRUG_EXANTHEMA:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000111
        title: "Fixed drug exanthema"
        description: "A material disease entity consisting of one or more sharply demarcated inflammatory lesions of the skin or mucosa that are the output of a hypersensitivity reaction to a drug and recur at the same sites each time the patient is re-exposed to that drug."
      FIXING_BANDAGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000112
        title: "Fixing bandage"
        description: "A wound dressing that is a strip or tube of flexible material applied around a body part to hold another wound dressing in place over a wound."
      FLAMINAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000113
