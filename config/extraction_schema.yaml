slots:
  label:
    range: string
    description: "the term exactly as it appears in the text"
  category:
    range: BFOCategory
    description: "the single BFO/MILD category this term belongs to"
  grounded_to:
    range: uriorcurie
    description: "IRI of the existing MILD/WONT class, if this term already exists"
  subject:
    range: string
    description: "label of the subject entity"
  predicate:
    range: RelationType
    description: "the relation asserted"
  object:
    range: string
    description: "label of the object entity"
  entities:
    range: ExtractedEntity
    description: "every distinct term found in the text"
    multivalued: true
    inlined_as_list: true
  relations:
    range: ExtractedRelation
    description: "relations between the extracted terms"
    multivalued: true
    inlined_as_list: true

classes:
  ExtractedEntity:
    description: a term found in the text, typed to exactly one category
    slots: [label, category, grounded_to]
  ExtractedRelation:
    description: >-
      A relation between two extracted terms. Validity is decided by the category
      pair, not by the model's judgement.
    slots: [subject, predicate, object]
  ExtractionResult:
    tree_root: true
    description: everything extracted from one document
    slots: [entities, relations]

