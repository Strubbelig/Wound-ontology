      BOVINE_COLLAGEN_CONTAINING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000047
        title: "Bovine collagen containing wound dressing"
        description: "A wound-integrating wound dressing that has as part collagen derived from cattle."
      BROMELAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000048
