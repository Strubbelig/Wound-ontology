      INTRACUTANEOUS_SUTURE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000166
        title: "Intracutaneous suture"
        description: "A suture in situ that runs within the dermis along the wound edges and, between its ends, does not pass through the epidermal surface."
      IODINE_OINTMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000168
        title: "Iodine ointment"
        description: "A wound gel/ointment/cream that is an ointment with iodine or an iodine-releasing compound as its active ingredient."
      JACKSON_PRATT_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000170
        title: "Jackson-Pratt drain"
        description: "A low-vacuum drain consisting of a perforated flexible tube connected to a compressible bulb reservoir whose re-expansion after manual compression produces the suction."
      LINEAR_IGA_DERMATOSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000173
        title: "Linear IgA dermatosis"
        description: "A material disease entity that has as parts one or more subepidermal blisters that are immune-mediated tissue disorders marked by linear deposits of IgA antibodies along the epidermal basement membrane zone."
      LIVEDOVASCULOPATHY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000174
        title: "Livedovasculopathy"
        description: "A material disease entity consisting of occlusive thrombi in small blood vessels of the dermis, without primary inflammation of the vessel walls."
      LIVIDER_WOUND_MARGIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000175
        title: "Livider wound margin"
        description: "A wound edge that bears the quality livid."
      LOW_VACUUM_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000177
        title: "Low-vacuum drain"
        description: "An active drain that draws fluid out of a wound or body cavity under a mild negative pressure, weaker than that applied by a high-vacuum drain."
      LYMPHATIC_FISTULA:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000178
        title: "Lymphatic fistula"
        description: "A material disease entity consisting of an abnormal passage that connects a lymphatic vessel or lymph node with the body surface or another anatomical structure and through which lymph leaks."
      MACERATED_WOUND_EDGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000180
        title: "Macerated wound edge"
        description: "A wound edge that bears the quality macerated."
      MALIGNANT_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000182
        title: "Malignant wound"
        description: "A wound that is the specified output of a disorder development process that has as participant a malignancy."
      MANUKA_HONEY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000185
        title: "Manuka honey"
        description: "A medicinal honey produced by bees from the nectar of the manuka tree, Leptospermum scoparium."
      MARJOLIN_ULCER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000186
        title: "Marjolin ulcer"
        description: "A skin wound that is an ulcerated malignant neoplasm in scar tissue or in a long-standing chronic wound."
      MATERIAL_USED_FOR_WOUND_TREATMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000188
        title: "Material used for wound treatment"
        description: "A material entity that is intended to be applied to or placed in a wound in the course of a wound treatment process."
      MEDICINAL_HONEY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000196
        title: "Medicinal honey"
        description: "A material used for wound treatment that consists of honey that has been filtered and sterilised to a standard for medical application to wounds."
      MICROANGIOPATHY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000201
        title: "Microangiopathy"
        description: "An angiopathy in which the abnormal structure of the vessel wall or lumen affects small blood vessels, namely arterioles, capillaries or venules."
      MOIST_NECROSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000203
        title: "Moist necrosis"
        description: "A necrotic material that has a high water content and a soft, wet consistency, in contrast to dry, hardened necrotic tissue such as eschar."
      MONALDI_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000204
        title: "Monaldi drain"
        description: "A thoracic drain that is inserted through the anterior chest wall at the second intercostal space in the midclavicular line."
      MONOFILAMENT_THREAD_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000205
        title: "Monofilament thread material"
        description: "A material entity that is suture thread consisting of a single strand, rather than of several filaments braided or twisted together."
      N_PROPANOL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000207
        title: "n-propanol"
        description: "An antiseptic alcohol that consists of propan-1-ol, the unbranched primary alcohol with three carbon atoms."
      NACL_0_9:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000208
        title: "NaCl 0.9%"
        description: "A wound irrigation solution that is an aqueous solution of sodium chloride at a concentration of 0.9% (w/v), isotonic with body fluids."
      NACL_10:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000209
        title: "NaCl 10%"
        description: "A wound irrigation solution that is an aqueous solution of sodium chloride at a concentration of 10% (w/v), hypertonic relative to body fluids."
      NECROTIC_WOUND_BED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000211
        title: "Necrotic wound bed"
        description: "A wound base that bears the quality necrotic."
      NON_ABSORBABLE_THREAD_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000215
        title: "Non-absorbable thread material"
        description: "A material entity that is suture thread which is not broken down and absorbed by the body's tissues and so persists in the tissue unless it is removed."
      OCTENIDINE_GEL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000220
        title: "Octenidine gel"
        description: "A wound gel/ointment/cream that has a gel consistency and contains octenidine dihydrochloride as its antiseptic active substance."
      OPEN_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000221
        title: "Open drain"
        description: "A drain that discharges fluid from a wound or body cavity into an absorbent dressing or the surroundings rather than into a sealed collection container."
      PASSIVE_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000224
        title: "Passive drain"
        description: "A drain that removes fluid by gravity, capillary action or pressure differences arising in the body, without suction from an external source."
      PENROSE_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000227
        title: "Penrose drain"
        description: "A capillary drain consisting of a soft, collapsible, thin-walled open tube that is placed in a wound and conducts fluid out along its inner and outer surfaces without applied suction."
      PERIPHERAL_ARTERIAL_OCCLUSIVE_DISEASE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000229
        title: "Peripheral arterial occlusive disease"
        description: "An angiopathy consisting in the narrowing or occlusion of the lumen of one or more arteries supplying the extremities, such that perfusion of the tissue of the affected limb is reduced."
      PHLEGMON:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000233
        title: "Phlegmon"
        description: "A material disease entity consisting in a purulent inflammation of soft connective tissue that spreads diffusely through the tissue and is not confined by a capsule."
      PIGTAIL_CATHETER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000235
        title: "Pigtail catheter"
        description: "A passive drain consisting of a thin flexible catheter whose distal end curls into a loop once placed, holding the catheter in position, and that has side holes in the looped segment through which fluid enters."
      PLASTER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000237
        title: "Plaster"
        description: "A fixing bandage consisting of a flexible backing strip coated on one side with a pressure-sensitive adhesive, that holds a dressing or device in place by adhering to the skin."
      POLIHEXANIDE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000238
        title: "Polihexanide"
        description: "A biguanide that is a polymer whose repeating unit consists of a biguanide group linked to a hexamethylene chain."
      POLIHEXANIDE_CONTAINING_SOLUTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000239
        title: "Polihexanide containing solution"
        description: "An antiseptic solution that has polihexanide as an active antiseptic ingredient."
      POLIHEXANIDE_GEL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000240
        title: "Polihexanide gel"
        description: "A wound gel/ointment/cream that has a semi-solid, water-based gel consistency and contains polihexanide as an active antiseptic ingredient."
      POLYFILAMENT_THREAD_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000241
        title: "Polyfilament thread material"
        description: "A material entity consisting of surgical suture thread in which each strand is made of multiple filaments braided or twisted together."
      PRIMARILY_HEALING_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000247
        title: "Primarily-healing wound"
        description: "A wound that participates in a wound healing by primary intention."
      PURULENT_EXUDATE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000253
        title: "Purulent exudate"
        description: "A wound exudate that is opaque and viscous and consists predominantly of neutrophils, cellular debris and liquefied necrotic tissue."
      REDDENED_WOUND_EDGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000256
        title: "Reddened wound edge"
        description: "A wound edge that bears the quality reddened."
      REDON_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000258
        title: "Redon drain"
        description: "A high-vacuum drain consisting of a perforated plastic tube placed in a wound and connected to a closed collecting bottle that is evacuated before use, so that the negative pressure in the bottle draws fluid out of the wound."
      REGENERATIVELY_HEALING_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000261
        title: "Regeneratively-healing wound"
        description: "A wound that participates in a regenerative wound healing."
      RESORBABLE_THREAD_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000265
        title: "Resorbable thread material"
        description: "A material entity consisting of surgical suture thread made of a material that, after implantation, is degraded by hydrolysis or enzymatic action in the body and absorbed, so that it does not have to be removed."
      RINGER_SOLUTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000266
        title: "Ringer solution"
        description: "A wound irrigation solution consisting of sodium chloride, potassium chloride and calcium chloride dissolved in water, isotonic with blood plasma."
      ROBINSON_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000267
        title: "Robinson drain"
        description: "A gravity drain that is a closed passive system consisting of a soft perforated tube leading from the wound or body cavity into a sealed collection bag."
      SANGUINE_EXUDATE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000268
        title: "Sanguine exudate"
        description: "A wound exudate that consists predominantly of fresh blood and is thin and red."
      SCRATCH_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000271
        title: "Scratch wound"
        description: "A traumatic wound that is a superficial linear disruption of the skin and the output of a process in which a sharp or rough object is drawn across the skin surface."
      SECONDARILY_HEALING_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000272
        title: "Secondarily-healing wound"
        description: "A wound that participates in a wound healing by secondary intention."
      SECONDARY_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000273
        title: "Secondary dressing"
        description: "A wound dressing that is placed over a primary dressing and does not itself contact the wound bed."
      SEMI_OPEN_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000275
        title: "Semi-open drain"
        description: "A drain consisting of a tube that leads fluid out of the wound into a dressing or an unsealed receptacle, so that the drainage pathway remains open to the environment."
      SEROMA:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000276
        title: "Seroma"
        description: "A material disease entity that is a collection of serous fluid accumulated in a tissue space or surgically created dead space, consisting of neither pus nor blood."
      SEROSANGUINEOUS_EXUDATE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000277
        title: "Serosanguineous exudate"
        description: "A wound exudate that is thin, watery and pale red to pink, consisting of serous fluid mixed with a small amount of blood."
      SEROUS_EXUDATE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000278
        title: "Serous exudate"
        description: "A wound exudate that is thin, watery and clear to pale yellow, consisting of plasma-derived fluid without appreciable blood or pus."
      SILICONE_SPACER_GRID:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000280
        title: "Silicone spacer grid"
        description: "A wound dressing consisting of a thin perforated silicone sheet that is placed in direct contact with the wound bed and through whose openings exudate passes to an overlying dressing."
      SILVER_CONTAINING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000282
        title: "Silver-containing wound dressing"
        description: "A wound dressing that has silver, in elemental, ionic or compound form, incorporated as a component bearing an antimicrobial agent role."
      SIMPLE_INTERRUPTED_SUTURE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000283
        title: "Simple interrupted suture"
        description: "A suture in situ consisting of a single stitch that passes through both wound edges and is knotted and cut separately from any adjacent stitch."
      SKIN_GRAFT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000285
        title: "Skin graft"
        description: "A material entity that is a portion of skin, comprising epidermis and part or all of the dermis, that has been separated from its donor site and its blood supply and is transferred to a recipient site."
      SOFTENED_WOUND_EDGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000290
        title: "Softened wound edge"
        description: "A wound edge that bears the quality softened."
      SPLIT_THICKNESS_SKIN_GRAFT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000292
        title: "Split-thickness skin graft"
        description: "A skin graft that consists of the epidermis together with only part of the thickness of the underlying dermis of the donor site."
      SUBSTANCE_USED_FOR_ENZYMATIC_WOUND_DEBRIDEMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000296
        title: "Substance used for enzymatic wound debridement"
        description: "A material used for wound treatment that contains exogenous enzymes which, when applied to a wound, degrade necrotic tissue and devitalized extracellular matrix so that they can be removed from the wound bed."
      SUTURE_IN_SITU:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000301
        title: "Suture in situ"
        description: "A device consisting of suture material that has been placed through or around tissue of a patient and secured there so that it holds the tissue in apposition or in position."
      SYNTHETIC_WOUND_DRESSING_FOAM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000304
        title: "Synthetic wound dressing foam"
        description: "A wound dressing that consists of a porous, absorbent foam made of a synthetic polymer."
      TERTIARILY_HEALING_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000307
        title: "Tertiarily-healing wound"
        description: "A wound that participates in a wound healing by tertiary intention."
      THERMAL_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000310
        title: "Thermal wound"
        description: "A traumatic wound that is the output of a heat impact process in wound development, in which tissue is damaged by the action of excessive heat."
      THORACIC_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000311
        title: "Thoracic drain"
        description: "A drain that is inserted through the chest wall into the pleural cavity or mediastinum to evacuate air, fluid or blood from it."
      TRACE_ELEMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000336
        title: "trace element"
        description: "A material entity that bears the role nutrient."
      TRANSPARENT_POLYURETHANE_FILM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000337
        title: "Transparent polyurethane film"
        description: "A wound dressing that consists of a thin, transparent, semipermeable sheet of polyurethane through which the covered wound can be inspected."
      TRAUMATIC_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000339
        title: "Traumatic wound"
        description: "A wound that is the output of a trauma process in wound development."
      TYMPANIC_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000344
        title: "Tympanic drain"
        description: "A drain that is a small tube placed through an incision in the tympanic membrane so that the middle ear is ventilated and fluid can drain from it."
      ULCUS_CRURIS_MIXTUM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000346
        title: "Ulcus cruris mixtum"
        description: "A skin wound that is an ulcer of the lower leg in a patient who has both chronic venous insufficiency and peripheral arterial disease, so that venous and arterial disorders together form its pathogenic background."
      ULCUS_CRURIS_VENOSUM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000347
        title: "Ulcus cruris venosum"
        description: "A venous insufficiency wound that is an ulcer of the skin of the lower leg."
        aliases: ["Venous leg ulcer"]
      ULCUS_HYPERTONICUS_MARTORELL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000348
        title: "Ulcus hypertonicus Martorell"
        description: "A skin wound that is an ulcer of the lower leg at a site of ischemic necrosis of the skin, with stenosing arteriolosclerosis of subcutaneous arterioles, in a patient with arterial hypertension."
      UNDERMINED_WOUND_MARGIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000351
        title: "Undermined wound margin"
        description: "A wound edge that bears the quality undermined."
      VENTRICULAR_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000355
        title: "Ventricular drain"
        description: "A drain that is inserted through the skull into a cerebral ventricle to conduct cerebrospinal fluid out of the ventricular system."
      VERTICAL_MATTRESS_SUTURE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000356
        title: "Vertical mattress suture"
        description: "A suture in situ in which each stitch crosses the wound twice in a plane perpendicular to the wound edge, with one deep pass placed far from the wound edge and one superficial pass placed near it, and is tied on the side where it entered."
      VOLTAREN_GEL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000358
        title: "Voltaren gel"
      WOUND_DEHISCENCE_WITH_SUTURE_INSUFFICIENCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000379
        title: "Wound dehiscence with suture insufficiency"
        description: "A wound dehiscence that is the output of a wound dehiscence process in which the sutures holding the wound edges together fail to keep them approximated."
      WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000380
        title: "Wound"
        description: "An injury that has as part a portion of the skin, alone or in continuity with damaged deeper tissue such as fascia, muscle or bone, and that is the output of a wound development process. Damaged skin tissue is a wound even while it is still attached, such as necrotic skin; an injury that involves no skin, such as a burn of the inner airways, is no wound."
      WOUND_AND_SOFT_TISSUE_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000381
        title: "Wound and soft tissue drain"
        description: "A drain that is placed in a wound or in soft tissue to conduct accumulated fluid out of it."
      WOUND_BASE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000382
        title: "Wound base"
        description: "A material entity that is part of a wound and consists of the tissue forming the floor of the wound, bounded by the wound edges."
      WOUND_BIOFILM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000383
        title: "Wound biofilm"
        description: "A material entity that is a structured community of microorganisms embedded in a self-produced extracellular polymeric matrix and attached to the surface or tissue of a wound."
      VENOUS_INSUFFICIENCY_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000384
        title: "Venous insufficiency wound"
        description: "A wound that is the output of a wound development process that has as part a process of the course of a venous insufficiency disorder. No claim is made that the disorder caused the wound."
        aliases: ["venous insufficiency ulcer"]
      WOUND_DEHISCENCE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000392
        title: "Wound dehiscence"
        description: "A material disease entity that is the output of a wound dehiscence process."
      WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000398
        title: "Wound dressing"
        description: "A device that bears a wound coverage function."
      WOUND_DRESSING_COMPOSED_OF_A_POLYLACTIDE_MEMBRANE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000399
        title: "Wound dressing composed of a polylactide membrane"
        description: "A wound-integrating wound dressing that consists of a membrane made of polylactide, a resorbable polymer of lactic acid."
      WOUND_DRESSING_COMPOSED_OF_POLYURETHANE_FOAM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000400
        title: "Wound dressing composed of polyurethane foam"
        description: "A wound-integrating wound dressing that consists of a porous foam matrix made of polyurethane."
      WOUND_EDGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000401
        title: "Wound edge"
        description: "A material entity that is part of a wound and consists of the tissue at the margin of the wound where the wound bed adjoins the surrounding intact skin."
      WOUND_EXUDATE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000404
        title: "Wound exudate"
        description: "A material entity that is fluid released from the tissues of a wound, derived from blood plasma that has passed from the vasculature into the wound."
      WOUND_GEL_OINTMENT_CREAM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000406
        title: "Wound gel/ointment/cream"
        description: "A clinical drug product that has a semisolid dosage form and is intended for topical application to a wound."
      WOUND_HEALING_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000408
        title: "Wound healing disorder"
        description: "A material disease entity consisting in the abnormal organization of the tissues of and around a wound of a patient, such that the wound does not progress through healing in the expected manner."
      WOUND_IRRIGATION_SOLUTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000412
        title: "Wound irrigation solution"
        description: "A clinical drug product that is a liquid formulated for rinsing a wound in a wound irrigation process."
      WOUND_POCKET:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000417
        title: "Wound pocket"
      WOUND_SPACER_GRID:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000420
        title: "Wound spacer grid"
        description: "A wound dressing that is a non-adherent open-mesh layer placed in direct contact with the wound bed, which separates the wound from a secondary dressing and lets exudate pass through it."
      WOUND_WITH_ACCOMPANYING_FRACTURE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000426
        title: "Wound with accompanying fracture"
        description: "A traumatic wound that is the output of a trauma process in wound development which also has as output a fracture of a bone in the same body region."
      WOUND_INTEGRATING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000427
        title: "Wound-integrating wound dressing"
      WOUNDS_CLASSIFIED_ACCORDING_TO_GUSTILO_AND_ANDERSON:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000429
        title: "Wounds classified according to Gustilo and Anderson"
        description: "A wound with accompanying fracture that is a skin wound through which the fracture site communicates with the outside of the body, i.e. the soft tissue wound of an open fracture graded by the Gustilo and Anderson classification."
      WOUNDS_CLASSIFIED_ACCORDING_TO_TSCHERNE_AND_OESTERN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000430
        title: "Wounds classified according to Tscherne and Oestern"
      T_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000432
        title: "T drain"
        description: "An abdominal drain consisting of a T-shaped tube whose short crossbar limbs lie in the lumen of the common bile duct and whose long limb leads out through the abdominal wall, bearing a function of draining bile externally."
      SKIN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000441
        title: "Skin wound"
        description: "A wound whose disrupted tissue is skin."
      CHRONIC_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000442
        title: "Chronic wound"
        description: "A wound that has failed to progress through the phases of healing in an orderly and timely fashion."
        aliases: ["Chronic non-healing wound"]
      ERYSIPELAS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000443
        title: "Erysipelas"
        description: "A superficial bacterial skin infection, characteristically caused by Streptococcus pyogenes, involving the upper dermis and superficial lymphatics."
      ANTISEPTIC_AGENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000444
        title: "Antiseptic agent"
        description: "A material used for wound treatment that bears the antiseptic drug role."
      ANTISEPTIC_BIGUANIDE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000445
        title: "Antiseptic biguanide"
        description: "A biguanide that bears the antiseptic drug role."
      MUCOUS_MEMBRANE_PEMPHIGOID:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000446
        title: "Mucous membrane pemphigoid"
        description: "A material disease entity that has as parts one or more mucosal blisters that are autoimmune tissue disorders."
      MRSA_INFECTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000447
        title: "MRSA infection"
        description: "A material disease entity that is an infection whose causal agent is a methicillin-resistant strain of Staphylococcus aureus."
      NEOPLASM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000464
        title: "Neoplasm"
        description: "A material disease entity that has as part an abnormal mass of tissue arising from autonomous, uncoordinated proliferation of its constituent cells."
      MALIGNANCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000465
        title: "Malignancy"
        description: "A neoplasm whose constituent cells are disposed to invade surrounding tissue or to metastasize."
      ANGIOPATHY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000466
        title: "Angiopathy"
        description: "A material disease entity consisting in an abnormal structure of the wall or of the lumen of one or more blood vessels, such that perfusion of the tissue those vessels supply is reduced."
      DIABETIC_METABOLIC_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000467
        title: "Diabetic metabolic disorder"
        description: "A material disease entity consisting in the abnormal organization of the insulin-secreting or insulin-responsive tissues of a patient, such that glucose homeostasis is not maintained."
      VENOUS_INSUFFICIENCY_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000468
        title: "Venous insufficiency disorder"
        description: "A material disease entity consisting in an abnormal structure of the valves or walls of the veins of a limb, such that venous return from that limb against gravity is impaired."
      AUTOIMMUNE_TISSUE_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000469
        title: "Autoimmune tissue disorder"
        description: "A material disease entity consisting in tissue of a patient that has been damaged by an immune response directed against constituents normally present in that patient's own body."
      LYMPHOCELE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000470
        title: "Lymphocele"
        description: "A material disease entity consisting in a collection of lymphatic fluid within a non-epithelialised cavity in a bodily structure."
      ABSCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000472
        title: "Abscess"
        description: "A material disease entity consisting in a localized collection of purulent material within a bodily structure, surrounded by inflamed and granulating tissue."
      MUCOSAL_BLISTER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000473
        title: "Mucosal blister"
        description: "A material disease entity that is part of a mucosa and consists in a fluid-filled separation of the epithelium of that mucosa from the tissue beneath it."
      WOUND_WITH_MICROBIAL_BURDEN_ASSESSED_ACCORDING_TO_IWII:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000481
        title: "Wound with microbial burden assessed according to IWII"
        description: "A wound whose microbial burden is assessed on the IWII wound infection continuum: it bears the quality sterile, contaminated, colonized or infected."
      FIRST_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000482
        title: "First-degree burn wound"
        description: "A thermal wound in which the injury is confined to the epidermis."
      SECOND_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000483
        title: "Second-degree burn wound"
        description: "A thermal wound in which the injury extends through the epidermis into the dermis."
        aliases: ["2nd degree burn"]
      THIRD_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000484
        title: "Third-degree burn wound"
        description: "A thermal wound in which the injury extends through the full thickness of the skin."
      FOURTH_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000485
        title: "Fourth-degree burn wound"
        description: "A thermal wound in which the injury extends beyond the skin into underlying tissue such as fascia, muscle or bone."
      OPEN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000504
        title: "Open wound"
        description: "A wound that bears the quality open: its surface is breached, so that underlying tissue is exposed."
      CLOSED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000505
        title: "Closed wound"
        description: "A wound that bears the quality closed: the skin or mucosal surface over the injured tissue is intact."
      EPITHELIALIZED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000506
        title: "Epithelialized wound"
        description: "A wound that bears the quality epithelialized: its surface has been covered by newly formed epithelium."
        aliases: ["Healed wound"]
      LARGE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000507
        title: "Large wound"
        description: "A wound that bears the quality increased size: its extent is greater than is typical for a wound of its kind."
      DEEP_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000508
        title: "Deep wound"
        description: "A wound that bears the quality increased depth: it extends further into the tissue than is typical for a wound of its kind."
      ISCHEMIC_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000509
        title: "Ischemic wound"
        description: "An arterial insufficiency wound that bears the quality ischemic."
      ARTERIAL_INSUFFICIENCY_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000510
        title: "Arterial insufficiency wound"
        description: "A wound that is the output of a wound development process that has as part a process of the course of a peripheral arterial occlusive disease. No claim is made that the disorder caused the wound."
        aliases: ["arterial insufficiency ulcer"]
      COLONIZED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000511
        title: "Colonized wound"
        description: "A wound with recognized microbial burden that bears the quality colonized."
      WOUND_WITH_MICROBIAL_BURDEN_ASSESSED_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000524
        title: "Wound with microbial burden assessed according to CDC"
        description: "A wound that is classified by the CDC surgical wound classification: clean, clean-contaminated, contaminated or dirty, according to the state of the operative field."
      CONTAMINATED_WOUND_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000525
        title: "Contaminated wound according to CDC"
        description: "A wound with microbial burden assessed according to CDC that is an open, fresh, accidental wound, or an operative wound with a major break in sterile technique or gross spillage from the gastrointestinal tract."
      DIRTY_WOUND_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000526
        title: "Dirty wound according to CDC"
        description: "A wound with microbial burden assessed according to CDC that is an old traumatic wound with retained devitalized tissue, or one that involves existing clinical infection or perforated viscera."
      CLEAN_WOUND_ACCORDING_TO_IWII:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000527
        title: "Clean wound according to IWII"
        description: "A wound with microbial burden assessed according to IWII that bears the quality sterile."
        aliases: ["Aseptic wound"]
      PRESSURE_ULCER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000534
        title: "Pressure ulcer"
        description: "A wound that is the output of a wound development process that has as part a pressure impact process."
        aliases: ["decubitus ulcer"]
      GROUP_A_STREPTOCOCCUS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000547
        title: "Group A Streptococcus"
        description: "A pathogen that is a Gram-positive coccus of the genus Streptococcus bearing the Lancefield group A carbohydrate antigen in its cell wall."
      VANCOMYCIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000548
        title: "Vancomycin"
        description: "A molecule of the glycopeptide vancomycin, a glycosylated tricyclic heptapeptide that binds the D-alanyl-D-alanine termini of peptidoglycan precursors and thereby inhibits bacterial cell wall synthesis, and that has an antibiotic drug role."
      DIABETIC_FOOT_ULCER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000549
        title: "Diabetic foot ulcer"
        description: "A diabetic wound that is located in a foot."
      SURGICAL_SITE_INFECTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000550
        title: "Surgical site infection"
        description: "A material disease entity that is an infection by microorganisms of the surgical incision, of the tissues at the operative site or of an organ or space manipulated during a surgical operation, beginning after that operation."
      SOFT_TISSUE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000551
        title: "Soft tissue wound"
        description: "A wound whose damaged tissue is non-osseous covering, connecting or supporting tissue of the body, such as skin, subcutis, fascia, muscle, tendon or ligament, rather than bone or a parenchymal organ."
      LACERATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000552
        title: "Laceration"
        description: "A traumatic wound in which tissue has been torn or split by blunt force and that has irregular wound margins."
      ACUTE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000553
        title: "Acute wound"
        description: "A wound that has recently arisen and participates in a wound healing proceeding through the normal phases of repair in an orderly and timely sequence."
      FOREIGN_BODY_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000554
        title: "Foreign body wound"
        description: "A wound that is the output of a wound development process that has as part a foreign body process."
      FOREIGN_BODY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000555
        title: "Foreign body"
        description: "A material entity that is located in a body part or wound of an organism, is not part of that organism, and has entered or been placed there from outside."
      HYPERTROPHIC_SCAR:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000556
        title: "Hypertrophic scar"
        description: "A material entity that is a raised mass of excess collagenous scar tissue at the site of a healed wound, is the output of an excessive collagen deposition process, and remains confined to the boundaries of the original wound."
      SEPSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000558
        title: "Sepsis"
        description: "A material disease entity consisting in the abnormal organization of the organs or tissues of a patient that is the output of a dysregulated host response to an infection, such that organ function is impaired."
      OSTEOMYELITIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000559
        title: "Osteomyelitis"
        description: "A material disease entity that is a portion of bone, including its marrow, affected by inflammation."
      PRESSURE_REDISTRIBUTION_MATTRESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000570
        title: "Pressure redistribution mattress"
        description: "A device that is a support surface on which a recumbent person lies and that bears a pressure redistribution function."
      THERAPEUTIC_FOOTWEAR:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000571
        title: "Therapeutic footwear"
        description: "A device that is worn on the foot and bears a pressure redistribution function acting on the surfaces of the foot."
      TRAUMATIC_INJURY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0007237
        title: "Traumatic injury"
        description: "An injury that is the output of a trauma process."
      INJURY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0007817
        title: "Injury"
        description: "A material disease entity that is structural damage to a tissue or an organ, however it came about."
      PATHOGEN_WITH_WOUND_INFECTING_TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120019
        title: "pathogen with wound infecting tendency"
        description: "A pathogen that bears a wound infecting tendency."
      NECROTIC_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120020
        title: "Necrotic material"
        description: "A material disease entity consisting of a portion of a patient's tissue whose cells have died through pathological cell death while that portion remains within or attached to the body."
  ImmaterialEntityTerm:
    description: >-
      Existing 'immaterial entity' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      SPATIAL_REGION:
        meaning: http://purl.obolibrary.org/obo/BFO_0000006
        title: "spatial region"
      TWO_DIMENSIONAL_SPATIAL_REGION:
        meaning: http://purl.obolibrary.org/obo/BFO_0000009
        title: "two-dimensional spatial region"
      ZERO_DIMENSIONAL_SPATIAL_REGION:
        meaning: http://purl.obolibrary.org/obo/BFO_0000018
        title: "zero-dimensional spatial region"
      ONE_DIMENSIONAL_SPATIAL_REGION:
        meaning: http://purl.obolibrary.org/obo/BFO_0000026
        title: "one-dimensional spatial region"
      THREE_DIMENSIONAL_SPATIAL_REGION:
        meaning: http://purl.obolibrary.org/obo/BFO_0000028
        title: "three-dimensional spatial region"
      SITE:
        meaning: http://purl.obolibrary.org/obo/BFO_0000029
        title: "site"
      CONTINUANT_FIAT_BOUNDARY:
        meaning: http://purl.obolibrary.org/obo/BFO_0000140
        title: "continuant fiat boundary"
        description: "b is a continuant fiat boundary = Def. b is an immaterial entity that is of zero, one or two dimensions and does not include a spatial region as part. (axiom label in BFO2 Reference: [029-001])"
      FIAT_LINE:
        meaning: http://purl.obolibrary.org/obo/BFO_0000142
        title: "fiat line"
      FIAT_SURFACE:
        meaning: http://purl.obolibrary.org/obo/BFO_0000146
        title: "fiat surface"
      FIAT_POINT:
        meaning: http://purl.obolibrary.org/obo/BFO_0000147
        title: "fiat point"
  QualityTerm:
    description: >-
      Existing 'quality' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      RELATIONAL_QUALITY:
        meaning: http://purl.obolibrary.org/obo/BFO_0000145
        title: "relational quality"
        description: "b is a relational quality = Def. for some independent continuants c, d and for some time t: b quality_of c at t & b quality_of d at t. (axiom label in BFO2 Reference: [057-001])"
      PATHOLOGICAL:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120102
        title: "pathological"
        description: "A quality that a material entity has because medicine classifies it as pathological. Pathologicity is asserted, never inferred: MILD lays down no criteria, rules or inferences for it, because what is pathological can depend on context."
      REDNESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000257
        title: "Redness"
      THREAD_SIZE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000315
        title: "Thread size"
        description: "A size that inheres in a surgical suture thread and corresponds to a designation of its diameter in a standardized suture sizing scale."
      THREAD_SIZE_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000316
        title: "Thread size 0"
        description: "A thread size that corresponds to the suture size designation 0 of the United States Pharmacopeia scale, next larger than 2-0 and next smaller than 1."
      THREAD_SIZE_1:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000317
        title: "Thread size 1"
        description: "A thread size that corresponds to the suture size designation 1 of the United States Pharmacopeia scale, next larger than 0 and next smaller than 2."
      THREAD_SIZE_1_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000318
        title: "Thread size 1-0"
      THREAD_SIZE_10_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000319
        title: "Thread size 10-0"
        description: "A thread size that corresponds to the suture size designation 10-0 of the United States Pharmacopeia scale, next smaller than 9-0 and next larger than 11-0."
      THREAD_SIZE_11_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000320
        title: "Thread size 11-0"
        description: "A thread size that corresponds to the suture size designation 11-0 of the United States Pharmacopeia scale, next smaller than 10-0."
      THREAD_SIZE_12_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000321
        title: "Thread size 12-0"
        description: "A thread size that is the suture size designation 12-0, one step finer than 11-0 on the suture size scale, on which sizes written n-0 become finer as n increases."
      THREAD_SIZE_13_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000322
        title: "Thread size 13-0"
        description: "A thread size that is the suture size designation 13-0, one step finer than 12-0 on the suture size scale, on which sizes written n-0 become finer as n increases."
      THREAD_SIZE_2:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000323
        title: "Thread size 2"
        description: "A thread size that is the suture size designation 2, one step coarser than 1 on the suture size scale, on which sizes written as whole numbers become coarser as the number increases."
      THREAD_SIZE_2_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000324
        title: "Thread size 2-0"
        description: "A thread size that is the suture size designation 2-0, one step finer than 0 and one step coarser than 3-0 on the suture size scale."
      THREAD_SIZE_3:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000325
        title: "Thread size 3"
        description: "A thread size that is the suture size designation 3, one step coarser than 2 on the suture size scale, on which sizes written as whole numbers become coarser as the number increases."
      THREAD_SIZE_3_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000326
        title: "Thread size 3-0"
        description: "A thread size that is the suture size designation 3-0, one step finer than 2-0 and one step coarser than 4-0 on the suture size scale."
      THREAD_SIZE_4:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000327
        title: "Thread size 4"
        description: "A thread size that is the suture size designation 4, one step coarser than 3 on the suture size scale, on which sizes written as whole numbers become coarser as the number increases."
      THREAD_SIZE_4_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000328
        title: "Thread size 4-0"
        description: "A thread size that is the suture size designation 4-0, one step finer than 3-0 and one step coarser than 5-0 on the suture size scale."
      THREAD_SIZE_5:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000329
        title: "Thread size 5"
        description: "A thread size that is the suture size designation 5, one step coarser than 4 on the suture size scale, on which sizes written as whole numbers become coarser as the number increases."
      THREAD_SIZE_5_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000330
        title: "Thread size 5-0"
        description: "A thread size that is the suture size designation 5-0, one step finer than 4-0 and one step coarser than 6-0 on the suture size scale."
      THREAD_SIZE_6_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000331
        title: "Thread size 6-0"
        description: "A thread size that is the suture size designation 6-0, one step finer than 5-0 and one step coarser than 7-0 on the suture size scale."
      THREAD_SIZE_7_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000332
        title: "Thread size 7-0"
        description: "A thread size that is the suture size designation 7-0, one step finer than 6-0 and one step coarser than 8-0 on the suture size scale."
      THREAD_SIZE_8_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000333
        title: "Thread size 8-0"
        description: "A thread size that is the suture size designation 8-0, one step finer than 7-0 and one step coarser than 9-0 on the suture size scale."
      THREAD_SIZE_9_0:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000334
        title: "Thread size 9-0"
        description: "A thread size that is the suture size designation 9-0, one step finer than 8-0 and one step coarser than 10-0 on the suture size scale."
      DEGREE_OF_WOUND_PAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000415
        title: "degree of wound pain"
        description: "A quality that inheres in a patient, that is the extent of the pain that patient feels, and that is causally influenced by a wound."
        aliases: ["Wound pain"]
      DEGREE_OF_MACERATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000434
        title: "degree of maceration"
        description: "A quality of a wound edge that is the extent to which its tissue has been softened by prolonged exposure to moisture."
      MACERATED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000435
        title: "macerated"
        description: "A degree of maceration that qualifies its bearer as macerated."
      DEGREE_OF_TISSUE_FIRMNESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000450
        title: "degree of tissue firmness"
        description: "A quality of a bodily tissue that is the degree of resistance it offers to deformation."
      DEGREE_OF_SKIN_ADHERENCE_TO_UNDERLYING_TISSUE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000451
        title: "degree of skin adherence to underlying tissue"
        description: "A quality of skin that is the extent to which it remains attached to the tissue beneath it."
      DEGREE_OF_GRANULATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000452
        title: "degree of granulation"
        description: "A quality of a wound base that is the extent to which it is covered by granulation tissue."
      DEGREE_OF_NECROSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000453
        title: "degree of necrosis"
        description: "A quality of a wound base that is the extent to which its tissue is necrotic."
      DEGREE_OF_FIBRIN_COVERAGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000454
        title: "degree of fibrin coverage"
        description: "A quality of a wound base that is the extent to which it is covered by fibrin."
      DEGREE_OF_EPITHELIALIZATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000455
        title: "degree of epithelialization"
        description: "A quality of a wound base that is the extent to which it has been covered by new epithelium."
      REDDENED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000456
        title: "reddened"
        description: "A color that qualifies its bearer as reddened."
      LIVID:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000457
        title: "livid"
        description: "A color that qualifies its bearer as livid."
      SOFTENED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000458
        title: "softened"
        description: "A tissue firmness that qualifies its bearer as softened."
      UNDERMINED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000459
        title: "undermined"
        description: "A degree of skin adherence that qualifies its bearer as undermined."
      GRANULATING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000460
        title: "granulating"
        description: "A degree of granulation that qualifies its bearer as granulating."
      NECROTIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000461
        title: "necrotic"
        description: "A degree of necrosis that qualifies its bearer as necrotic."
      FIBRIN_COVERED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000462
        title: "fibrin-covered"
        description: "A degree of fibrin coverage that qualifies its bearer as fibrin-covered."
      EPITHELIALIZED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000463
        title: "epithelialized"
        description: "A degree of epithelialization that qualifies its bearer as epithelialized."
      PAINFUL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000474
        title: "painful"
        description: "A degree of wound pain that qualifies its bearer as painful."
      DEGREE_OF_TIME_AFTER_DISEASE_INCEPTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000475
        title: "degree of time after disease inception"
        description: "A quality of a material disease entity that is the time that has elapsed since the disorder came into existence, taken relative to the course expected for a disorder of its kind."
      ACUTE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000476
        title: "acute"
        description: "A degree of time after disease inception that qualifies its bearer as acute: the disorder is of recent onset and still within the period in which an orderly course is expected."
      CHRONIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000477
        title: "chronic"
        description: "A degree of time after disease inception that qualifies its bearer as chronic: the disorder has persisted beyond the period in which an orderly course is expected."
      DEGREE_OF_MICROBIAL_BURDEN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000478
        title: "degree of microbial burden"
        description: "A quality of a wound that is the extent to which microorganisms are present in it, multiply in it and elicit a response from its bearer."
      CONTAMINATED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000479
        title: "contaminated"
        description: "A degree of microbial burden that qualifies its bearer as contaminated: microorganisms are present in the wound but are not multiplying."
      INFECTED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000480
        title: "infected"
        description: "A degree of microbial burden that qualifies its bearer as infected: microorganisms are present in the wound, multiply in it and elicit a host response."
      STERILE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000486
        title: "sterile"
        description: "A degree of microbial burden that qualifies its bearer as sterile: no viable microorganisms are present in the wound."
      DEGREE_OF_TISSUE_PERFUSION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000487
        title: "degree of tissue perfusion"
        description: "A quality of a wound that is the extent to which its tissue is supplied with blood."
      ISCHEMIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000488
        title: "ischemic"
        description: "A degree of tissue perfusion that qualifies its bearer as ischemic: the blood supply to the tissue is insufficient for its metabolic needs."
      COLONIZED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000512
        title: "colonized"
        description: "A degree of microbial burden that qualifies its bearer as colonized: microorganisms are present in the wound and multiply in it, without invading its tissue or eliciting a host response."
  FunctionTerm:
    description: >-
      Existing 'function' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      PRESSURE_REDISTRIBUTION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000580
        title: "pressure redistribution function"
        description: "A function that is realized by spreading the mechanical load exerted on a body surface over a larger contact area or over time, thereby lowering the pressure on any single region."
      CLINICAL_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000583
        title: "clinical function"
        description: "A function whose realization serves the prevention, diagnosis, treatment or monitoring of a disease in a patient."
      THERAPEUTIC_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000584
        title: "therapeutic function"
        description: "A clinical function whose realization contributes to the treatment of a disease of a patient."
      WOUND_PROTECTION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120000
        title: "wound protection function"
        description: "A function that is realized by shielding a wound from mechanical injury, contamination or other harmful external influences."
      WOUND_SIGNALING_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120001
        title: "wound signaling function"
      FIRST_WOUND_DRESSING_LAYER_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120002
        title: "first wound dressing layer function"
      SECOND_WOUND_DRESSING_LAYER_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120003
        title: "second wound dressing layer function"
      WOUND_DRESSING_LAYER_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120004
        title: "wound dressing layer function"
        description: "A function that is borne by a layer of a wound dressing and is realized in processes in which that layer contributes to the action of the dressing on the wound."
      WOUND_DRESSING_FIXATION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120005
        title: "wound dressing fixation function"
        description: "A function that is realized in holding a wound dressing in place on or over a wound."
      NON_ADHESIVE_WOUND_DRESSING_FIXATION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120006
        title: "non adhesive wound dressing fixation function"
        description: "A wound dressing fixation function that is realized without its bearer adhering to the patient's skin."
      WOUND_MOISTURE_ABSORBANCE_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120007
        title: "wound moisture absorbance function"
        description: "A function that is realized in the uptake of exudate or other fluid from a wound into the bearer."
      WOUND_MOISTURE_REGULATION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120008
        title: "wound moisture regulation function"
        description: "A function that is realized in keeping the moisture of a wound bed from becoming either excessive or insufficient, by taking up fluid from the wound or by retaining or supplying fluid to it."
      WOUND_DESINFECTING_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120009
        title: "wound desinfecting function"
        description: "A function that is realized in killing or inactivating microorganisms in or on a wound."
      WOUND_EDGE_APPROXIMATING_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120010
        title: "wound edge approximating function"
        description: "A function that is realized in bringing the edges of a wound together and holding them in apposition."
      WOUND_INSPECTION_FACILITATION_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120011
        title: "wound inspection facilitation function"
        description: "A function that is realized in making a wound more readily accessible to visual or other examination."
      WOUND_COVERAGE_FUNCTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120012
        title: "wound coverage function"
        description: "A function that is realized in covering a wound so that it is shielded from the external environment."
  RoleTerm:
    description: >-
      Existing 'role' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      PHYSICIAN_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120093
        title: "Physician role"
        description: "A healthcare provider role that inheres in a person in virtue of that person being licensed to practice medicine."
      WOUND_EXPERT_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000403
        title: "Wound expert role"
        description: "A health care provider role that is borne by a person holding a specialised qualification in wound care and that is realized in the assessment and treatment of patients' wounds."
      WOUND_MANAGER_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000413
        title: "Wound manager role"
        description: "A health care provider role that is borne by a person holding a qualification in wound management and that is realized in organising and coordinating the wound care of patients."
      ANTIBIOTIC_DRUG_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000578
        title: "antibiotic drug role"
        description: "A clinical drug role borne by a substance used to kill bacteria or inhibit their growth."
      THERAPEUTIC_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000582
        title: "therapeutic role"
        description: "A role that is borne by an entity in virtue of its being used to treat, alleviate or cure a disease of a patient."
      LOCAL_ANESTHETIC_DRUG_ROLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000585
        title: "local anesthetic drug role"
        description: "A clinical drug role borne by a substance used to produce local anesthesia."
  TendencyTerm:
    description: >-
      Existing 'tendency' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120005
        title: "tendency"
        description: "A realizable entity that inheres in a material entity and that, in virtue of the physical makeup of its bearer, inclines that bearer toward participating in processes of a certain type — such that the inclination raises the objective probability of, but does not necessitate, the occurrence of those processes; that may be counteracted or reinforced by other tendencies of the same bearer without thereby ceasing to exist; and that may be realized to varying degrees, or not at all."
      PATHOLOGICAL_GENETIC_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120008
        title: "pathological genetic predisposition"
        description: "A disease predisposition that has as material basis a pathogenic genetic variant."
      PREDISPOSITION_FROM_AN_EXISTING_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120010
        title: "predisposition from an existing disorder"
        description: "A disease predisposition that inheres in a Homo sapiens that has as part a material disease entity."
      DISEASE_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120023
        title: "disease predisposition"
        description: "A tendency inhering in a person, grounded in a material basis, whose realization may produce a target material disease entity."
        aliases: ["Predisposition / risk proper"]
      PERPETUATION_TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120034
        title: "perpetuation tendency"
      ADVANCED_AGE_WOUND_HEALING_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000449
        title: "advanced age wound-healing predisposition"
        description: "A disease predisposition that inheres in a human being of advanced age and whose realization impairs wound healing."
      WOUND_INFECTING_TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120018
        title: "wound infecting tendency"
  InformationEntityTerm:
    description: >-
      Existing 'information entity' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      DISEASE_CLASSIFICATION_STAGE:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120000
        title: "disease classification stage"
      DISEASE_DIAGNOSTIC_RESULT:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120024
        title: "disease diagnostic result"
        description: "An information content entity that classifies or groups one or more material disease entities according to diagnostic criteria. Names such as 'substance use disorder' can denote this diagnostic layer when used as DSM/ICD-style categories or results; this diagnostic use is distinct from any material disease entity in the patient."
        aliases: ["diagnosis"]
      CONFIRMED_DISEASE_DIAGNOSTIC_RESULT_BY_NOT_COMPLETELY_OBJECTIVE_CRITERION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120026
        title: "confirmed disease diagnostic result by not completely objective criterion"
      CONFIRMED_DISEASES_DIAGNOSTIC_RESULT_BY_OBJECTIVE_CRITERION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120027
        title: "confirmed diseases diagnostic result by objective criterion"
      DISEASE_THRESHOLD_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120029
        title: "disease threshold specification"
        description: "A directive information entity that has as part a threshold value and a comparison_operator and that is about a phenotypic abnormality."
      THRESHOLD_VALUE:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120030
        title: "threshold value"
        description: "A scalar value specification that has as measurement unit a unit and that has a specified numeric value."
      DIFFERENTIAL_DIAGNOSIS_RESULT:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120032
        title: "differential diagnosis result"
        description: "A disease diagnostic result that has as part a candidate diagnosis."
      CANDIDATE_DIAGNOSIS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120033
        title: "candidate diagnosis"
        aliases: ["suspected diagnosis"]
      COMPARISON_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120036
        title: "comparison_operator"
      BINARY_COMPARISON_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120037
        title: "binary_comparison_operator"
      EQUALITY_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120038
        title: "equality_operator"
      INEQUALITY_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120039
        title: "inequality_operator"
      ORDERING_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120040
        title: "ordering_operator"
      GREATER_THAN_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120041
        title: "greater_than_operator"
      GREATER_THAN_OR_EQUAL_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120042
        title: "greater_than_or_equal_operator"
      LESS_THAN_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120043
        title: "less_than_operator"
      LESS_THAN_OR_EQUAL_OPERATOR:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120044
        title: "less_than_or_equal_operator"
      DISEASE_STAGE_CLASSIFICATION_RESULT:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120054
        title: "disease stage classification result"
        description: "An information content entity that is the specified output of a disease classification process and that is about nothing other than a material disease entity."
      TREATMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120089
        title: "treatment plan specification"
        description: "A plan specification that is about a treatment plan."
      THRESHOLD_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120098
        title: "threshold specification"
        description: "A directive information entity that has as part a threshold value and a comparison operator and that is about a quality, such that the quality's meeting the threshold is what the specification prescribes as decisive."
      MEDICAL_CONDITION_TREATMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120099
        title: "Medical condition treatment plan specification"
        aliases: ["Method used for medical condition treatment"]
      PROPHYLAXIS_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120100
        title: "prophylaxis plan specification"
      ANTIBIOTIC_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000016
        title: "Antibiotic therapy plan specification"
        description: "A treatment plan specification that prescribes the administration to a patient of one or more drugs bearing the antibiotic role, including the agent, route and duration."
        aliases: ["Antibiotic therapy"]
      ASEPSIS_SCORE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000028
        title: "ASEPSIS score"
        description: "A wound classification scale that grades a surgical wound for infection by summing points for additional treatment, serous discharge, erythema, purulent exudate, separation of deep tissues, isolation of bacteria and prolonged inpatient stay."
      ASEPTIC_CONDITIONS_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000029
        title: "Aseptic conditions plan specification"
        description: "A wound treatment plan specification that prescribes that wound treatment be carried out with sterile instruments, materials and techniques so that microorganisms are not introduced into the wound."
      ASEPTIC_CUTICLE_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000030
        title: "Aseptic cuticle plan specification"
        aliases: ["Aseptic cuticle"]
      BIOBAG_DEBRIDEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000038
        title: "Biobag debridement plan specification"
        description: "A biosurgical debridement plan specification that prescribes applying the sterile fly larvae to the wound enclosed in a sealed mesh bag, so that the larvae do not move freely over the wound surface."
        aliases: ["Biobag debridement"]
      BIOSURGICAL_DEBRIDEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000040
        title: "Biosurgical debridement plan specification"
        description: "A treatment plan specification that prescribes removing necrotic or devitalized tissue from a wound by applying live sterile fly larvae to it."
        aliases: ["Biosurgical debridement"]
      WOUND_CLASSIFICATION_SCALE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000066
        title: "Wound classification scale"
        description: "An information content entity that is a specified input of a wound classification process."
      CO2_BATH_WOUND_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000072
        title: "CO2 bath wound therapy plan specification"
        description: "A wound treatment plan specification that prescribes a bath in which the wound-bearing body part is exposed to carbon dioxide, either dissolved in water or as a gas."
        aliases: ["CO2 bath wound therapy"]
      COMPRESS_DEBRIDEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000076
        title: "Compress debridement plan specification"
        description: "A mechanical debridement plan specification that prescribes removing necrotic tissue, slough and debris from the wound bed by wiping or lifting them off with compresses."
        aliases: ["Compress debridement"]
      COMPRESSION_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000077
        title: "Compression therapy plan specification"
        description: "A wound treatment plan specification that prescribes applying sustained external pressure to the wound-bearing limb or body part by means of bandages, garments or devices."
        aliases: ["Compression therapy"]
      DRESSING_CHANGE_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000094
        title: "Dressing change plan specification"
        description: "A wound treatment plan specification that prescribes removing the wound dressing currently applied to a wound and applying a new one."
        aliases: ["Dressing change"]
      FLAP_PLASTY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000114
        title: "Flap plasty plan specification"
        description: "A wound treatment plan specification that prescribes closing or covering a wound by moving tissue from a donor site to the wound together with its own blood supply."
        aliases: ["Flap plasty"]
      GUSTILO_AND_ANDERSON_WOUND_CLASSIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000134
        title: "Gustilo and Anderson wound classification"
        description: "A wound classification scale that stratifies the wounds of open fractures by wound size, extent of soft-tissue damage, degree of contamination and presence of arterial injury requiring repair."
      GUSTILO_AND_ANDERSON_WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000135
        title: "Gustilo and Anderson wound classification grade"
        description: "A wound classification grade that is a category of the Gustilo and Anderson wound classification."
      HAND_DISINFECTION_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000138
        title: "Hand disinfection plan specification"
        aliases: ["Hand disinfection"]
      HYPERBARIC_O2_WOUND_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000152
        title: "Hyperbaric O2 wound therapy plan specification"
        description: "A wound treatment plan specification that prescribes that the patient breathe oxygen while inside a chamber pressurized above atmospheric pressure."
        aliases: ["Hyperbaric O2 wound therapy"]
      MECHANICAL_DEBRIDEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000189
        title: "Mechanical debridement plan specification"
        description: "A treatment plan specification that prescribes the removal of non-viable tissue, debris and foreign material from a wound by physical force applied to the wound bed, without cutting and without enzymatic, autolytic or biological agents."
        aliases: ["Mechanical debridement"]
      WOUND_TREATMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000200
        title: "Wound treatment plan specification"
        description: "A medical condition treatment plan specification that prescribes actions to be carried out on or for a wound with the aim of promoting its healing or preventing its deterioration."
        aliases: ["Method used for wound treatment"]
      NEGATIVE_PRESSURE_WOUND_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000213
        title: "Negative pressure wound therapy plan specification"
        description: "A wound treatment plan specification that prescribes the application of sub-atmospheric pressure to the wound bed through an airtight dressing connected to a suction source."
        aliases: ["Negative pressure wound therapy"]
      PAIN_MANAGEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000222
        title: "Pain management plan specification"
        description: "A medical condition treatment plan specification that prescribes pharmacological or non-pharmacological measures to prevent or reduce pain experienced by the patient."
        aliases: ["Pain management"]
      PATIENT_EDUCATION_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000225
        title: "Patient education plan specification"
        description: "A wound treatment plan specification that prescribes instructing the patient, and where applicable the patient's caregivers, about the wound, its care and the behaviours the patient is to carry out or avoid during treatment."
        aliases: ["Patient education"]
      PERIOPERATIVE_ANTIMICROBIAL_PROPHYLAXIS_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000228
        title: "Perioperative antimicrobial prophylaxis plan specification"
        description: "A prophylaxis plan specification that prescribes the administration of one or more antimicrobial agents to a patient in the period immediately before, during or after a surgical procedure, with the objective of preventing surgical site infection."
        aliases: ["Perioperative antimicrobial prophylaxis"]
      SHEA_CLASSIFICATION_OF_PRESSURE_ULCERS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000279
        title: "Shea classification of pressure ulcers"
        description: "A wound classification scale that grades pressure ulcers according to Shea by the deepest tissue layer involved, from the epidermis and dermis through subcutaneous fat and deep fascia to bone."
      SKIN_GRAFTING_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000286
        title: "Skin grafting plan specification"
        description: "A wound treatment plan specification that prescribes harvesting a skin graft from a donor site and fixing it onto the wound bed as the recipient site."
        aliases: ["Skin grafting"]
      SKIN_STAPLING_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000287
        title: "Skin stapling plan specification"
        description: "A wound closure technique plan specification that prescribes approximating the skin edges of a wound with metal staples inserted by a stapling device."
        aliases: ["Skin stapling"]
      SURFACE_DISINFECTION_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000297
        title: "Surface disinfection plan specification"
        aliases: ["Surface disinfection"]
      SUTURING_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000302
        title: "Suturing plan specification"
        description: "A wound closure technique plan specification that prescribes approximating the wound edges by passing a needle with attached suture material through the tissue on both sides of the wound and securing the thread."
        aliases: ["Suturing"]
      SYSTEMIC_ANTIBIOTIC_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000305
        title: "Systemic antibiotic therapy plan specification"
        description: "An antibiotic therapy plan specification that prescribes administering an antibiotic by an enteral or parenteral route so that it is distributed throughout the body via the bloodstream."
        aliases: ["Systemic antibiotic therapy"]
      TOPICAL_ANTIBIOTIC_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000335
        title: "Topical antibiotic therapy plan specification"
        description: "An antibiotic therapy plan specification that prescribes applying an antibiotic agent directly onto the surface of the skin, a mucous membrane or a wound at the site to be treated rather than giving it systemically."
        aliases: ["Topical antibiotic therapy"]
      TSCHERNE_AND_OESTERN_WOUND_CLASSIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000341
        title: "Tscherne and Oestern wound classification"
        description: "A wound classification scale that grades the severity of the soft-tissue injury accompanying a closed or open fracture."
      TSCHERNE_AND_OESTERN_WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000342
        title: "Tscherne and Oestern wound classification grade"
        description: "A wound classification grade that is a category of the Tscherne and Oestern wound classification."
      URGE_SCALE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000352
        title: "URGE scale"
      WAGNER_AND_ANDERSON_WOUND_CLASSIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000375
        title: "Wagner and Anderson wound classification"
      WAGNER_AND_ANDERSON_WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000376
        title: "Wagner and Anderson wound classification grade"
        description: "A wound classification grade that is a category of the Wagner and Anderson wound classification."
      WEARING_STERILE_GLOVES_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000378
        title: "Wearing sterile gloves plan specification"
        description: "An aseptic cuticle plan specification that prescribes that persons coming into contact with a wound or sterile field cover their hands with gloves that are free of viable microorganisms."
        aliases: ["Wearing Sterile gloves"]
      WOUND_CLOSURE_TECHNIQUE_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000389
        title: "Wound closure technique plan specification"
        description: "A treatment plan specification that prescribes the method and means by which a wound is to be closed in a wound closure process."
        aliases: ["Wound closure technique"]
      WOUND_FABRIC_ADHESIVE_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000405
        title: "Wound fabric adhesive plan specification"
        aliases: ["Wound Fabric adhesive"]
      WOUND_STAPLE_PLASTERING_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000421
        title: "Wound staple plastering plan specification"
        aliases: ["Wound staple plastering"]
      BURN_CLASSIFICATION_SCALE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000436
        title: "Burn classification scale"
        description: "A wound classification scale that stratifies burn wounds by the depth of tissue destroyed."
      BURN_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000437
        title: "Burn classification grade"
        description: "A wound classification grade that is a category of the burn classification scale."
      SHEA_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000438
        title: "Shea classification grade"
        description: "A wound classification grade that is a category of the Shea classification of pressure ulcers."
      CDC_SURGICAL_WOUND_CLASSIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000439
        title: "CDC surgical wound classification"
        description: "A wound classification scale that stratifies surgical wounds by degree of intraoperative microbial contamination."
      CDC_SURGICAL_WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000440
        title: "CDC surgical wound classification grade"
        description: "A wound classification grade that is a category of the CDC surgical wound classification."
      WOUND_DEPTH_MEASUREMENT_DATUM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000448
        title: "wound depth measurement datum"
        description: "A measurement datum that is about the depth of a wound."
      JACKSON_BURN_WOUND_ZONE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000492
        title: "Jackson burn wound zone"
        description: "A burn classification grade that is one of the three concentric zones of a burn wound distinguished by Jackson according to the severity of tissue damage."
        aliases: ["Burn classification grade of the Jackson classification"]
      JACKSON_BURN_WOUND_ZONE_CLASSIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000493
        title: "Jackson burn wound zone classification"
        description: "A wound classification scale that divides a burn wound into three concentric zones - coagulation, stasis and hyperemia - by the severity of tissue damage."
        aliases: ["Jackson burn wound classification"]
      BURN_WOUND_CLASSIFICATION_ACCORDING_TO_HILDANUS_AND_DERGANC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000494
        title: "Burn wound classification according to Hildanus and Derganc"
        description: "A wound classification scale that grades a burn wound by the depth of tissue destroyed: superficial, superficial partial-thickness, deep partial-thickness and full-thickness. Derganc's subdivision of the second degree refines the degree scheme attributed to Hildanus."
      BURN_WOUND_CLASSIFICATION_GRADE_ACCORDING_TO_HILDANUS_AND_DERGANC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000495
        title: "Burn wound classification grade according to Hildanus and Derganc"
        description: "A burn classification grade that is a category of the burn wound classification according to Hildanus and Derganc."
      PARTIAL_THICKNESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000513
        title: "Partial thickness"
        description: "A burn wound classification grade according to Hildanus and Derganc in which the injury extends into but not through the dermis; its instances are the superficial and the deep partial-thickness grade."
        aliases: ["Second degree"]
      IWII_WOUND_CLASSIFICATION_SCALE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000528
        title: "IWII wound classification scale"
        description: "A wound classification scale that grades a wound by its microbial burden on the wound infection continuum of the International Wound Infection Institute: clean, contaminated, colonized, infected."
      IWII_WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000529
        title: "IWII wound classification grade"
        description: "A wound classification grade that is a category of the IWII wound classification scale."
      WOUND_HEALING_PHASE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000561
        title: "Wound healing phase"
        description: "A wound classification grade of the scheme that divides wound healing into phases (hemostasis, inflammatory, proliferative, remodeling). The phases are labels assigned to stretches of the healing process, not processes themselves; each is about the processes it groups."
      PROPHYLACTIC_ANTIBIOTIC_THERAPY_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000569
        title: "Prophylactic antibiotic therapy plan specification"
        description: "A prophylaxis plan specification that prescribes giving a substance bearing an antibiotic drug role to a patient to prevent a bacterial infection."
        aliases: ["Prophylactic antibiotic therapy"]
      WOUND_HEALING_CRITERION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000576
        title: "Wound healing criterion"
        description: "A threshold specification that specifies a value of a wound attribute whose attainment indicates that a wound has healed or has reached a specified stage of healing."
      EPITHELIALIZATION_CRITERION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000577
        title: "Epithelialization criterion"
        description: "A wound healing criterion that is about the degree of epithelialization of a wound, specifying the extent of epithelial coverage of the wound surface to be attained."
      SURGICAL_DEBRIDEMENT_PLAN_SPECIFICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000581
        title: "Surgical debridement plan specification"
        description: "A treatment plan specification that prescribes the removal of necrotic, infected or devitalized tissue from a wound by means of surgical instruments."
        aliases: ["Surgical debridement"]
      WOUND_CLASSIFICATION_GRADE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120016
        title: "wound classification grade"
        description: "A disease classification stage that is assigned to a wound under a wound grading system and ranks the wound according to its severity."
      WOUND_CLASSIFICATION_RESULT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120017
        title: "Wound classification result"
        description: "A disease stage classification result that is about a wound and that is the specified output of a wound classification process."
  ProcessTerm:
    description: >-
      Existing 'process' classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      HISTORY:
        meaning: http://purl.obolibrary.org/obo/BFO_0000182
        title: "history"
      INTENDED_DISORDER_ELIMINATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120011
        title: "intended disorder elimination process"
      PREDISPOSITION_REALIZING_DISORDER_DEVELOPMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120012
        title: "predisposition realizing disorder development process"
        description: "A disorder development process that realizes a disease predisposition."
      DISORDER_DEVELOPMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120021
        title: "disorder development process"
        description: "A process that has as output a material disease entity."
        aliases: ["disease development process"]
      DISEASE_DIAGNOSIS_PROCESS_BY_MEASUREMENT:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120025
        title: "disease diagnosis process by measurement"
        description: "A disease diagnostic process that has as specified input a measurement datum and a disease threshold specification and that has as specified output a confirmed diseases diagnostic result by objective criteria."
      COURSE_OF_THE_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120028
        title: "course of the disease process"
        description: "A process that has as participant a material disease entity."
      DISEASE_DIAGNOSIS_PROCESS_BY_EXCLUSION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120045
        title: "Disease diagnosis process by exclusion"
      DISEASE_DIAGNOSIS_PROCESS_BY_CONCEPTUALIZATION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120046
        title: "disease diagnosis process by conceptualization"
      DISEASE_DIAGNOSTIC_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120047
        title: "Disease diagnostic process"
        description: "A planned process that has as output a disease diagnostic result."
      SUSPECTED_DISEASE_DIAGNOSIS_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120048
        title: "Suspected disease diagnosis process"
        description: "A disease diagnostic process that has as specified output a candidate diagnosis."
      DISORDER_CREATING_DISEASE_COURSE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120053
        title: "disorder creating disease course process"
      DISEASE_CLASSIFICATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120055
        title: "disease classification process"
        description: "A planned process that has as specified output a disease stage classification result."
      DISEASE_DISORDER_TREATMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120086
        title: "Disease disorder treatment process"
        description: "A planned process that realizes a treatment plan and that has as input a material disease entity."
      DISORDER_ELIMINATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120087
        title: "disorder elimination process"
      DISORDER_MODIFICATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120088
        title: "disorder modification process"
      DISORDER_ADDITION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120091
        title: "disorder addition process"
      ACIDITY_IMPACT_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000004
        title: "Acidity impact process in wound development"
      ASSESSING_PATIENT_S_MEDICAL_HISTORY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000032
        title: "Assessing patient's medical history"
        description: "A diagnostic process to assess wound characteristics in which information on the patient's past and current diseases, treatments and the origin and course of the wound is obtained from the patient, relatives or records."
      AUTOLYTIC_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000034
        title: "Autolytic wound debridement process"
        description: "A debridement process in which necrotic tissue and slough are broken down by the patient's own enzymes and phagocytic cells in a wound kept moist."
      WOUND_SPECIMEN_PROCUREMENT_BY_BIOPSY_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000039
        title: "Wound specimen procurement by biopsy process"
        description: "A wound diagnostic process in which a sample of tissue is cut or punched from the wound bed or wound edge and that has as specified output a wound tissue specimen for laboratory examination."
      BIOSURGICAL_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000041
        title: "Biosurgical wound debridement process"
        description: "A debridement process in which live sterile fly larvae applied to a wound remove its necrotic or devitalized tissue."
      CLINICAL_INSPECTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000069
        title: "Clinical inspection"
        description: "A diagnostic process to assess wound characteristics in which a clinician directly observes the wound and the periwound skin by eye."
      CLINICAL_WOUND_ASSESSMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000070
        title: "Clinical wound assessment"
        description: "A diagnostic process to assess wound characteristics in which a healthcare professional evaluates the wound, the periwound skin and the patient by history taking and physical examination at the point of care."
      COLD_PLASMA_WOUND_TREATMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000074
        title: "Cold plasma wound treatment process"
        description: "A wound treatment process in which a non-thermal, partially ionized gas generated at atmospheric pressure is applied to the wound."
      CUSA_R_ASSISTED_DEBRIDEMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000082
        title: "CUSA(r) assisted debridement"
        description: "An ultrasound-assisted wound debridement process that uses an ultrasonic surgical aspirator, which fragments tissue by ultrasonic vibration while simultaneously irrigating the site and aspirating the fragments."
      DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000084
        title: "Debridement process"
        description: "A wound cleansing process in which necrotic or devitalized tissue, slough, foreign material and debris are removed from the wound."
      DIAGNOSTIC_PROCESS_TO_ASSESS_WOUND_CHARACTERISTICS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000089
        title: "Diagnostic process to assess wound characteristics"
        description: "A wound diagnostic process in which the wound itself is examined and that has as specified output data about qualities of that wound."
      DOPPLER_SONOGRAPHIC_DIAGNOSTIC_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000092
        title: "Doppler sonographic diagnostic process"
        description: "A wound diagnostic process that uses ultrasound and the frequency shift of waves reflected from moving blood to assess blood flow in the vessels supplying the wound region."
      ENZYMATIC_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000098
        title: "Enzymatic wound debridement process"
        description: "A debridement process in which necrotic tissue and slough are broken down and removed by topically applied proteolytic enzymes."
      EPITHELIALIZATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000100
        title: "Epithelialization process"
        description: "A wound healing related physiological process in which epithelial cells migrate, proliferate and differentiate across the wound surface until it is covered by a new epithelium."
        aliases: ["Re-Epithelialization"]
      EXUDATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000106
        title: "Exudation process"
        description: "A wound healing related physiological process in which fluid containing plasma proteins and cells passes from blood vessels into the wound tissue and onto the wound surface."
      GERM_SPECTRUM_ASSESSMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000121
        title: "Germ spectrum assessment process"
        description: "A wound diagnostic process that has as specified output a datum identifying the microorganisms present in a sample of wound material."
      GRANULATION_TISSUE_FORMATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000132
        title: "Granulation tissue formation process"
        description: "A wound healing related physiological process in which new connective tissue rich in capillaries and fibroblasts grows from the wound base and fills the wound bed during the proliferative phase of healing."
        aliases: ["Granulation process"]
      HEAT_IMPACT_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000140
        title: "Heat impact process in wound development"
      HISTOPATHOLOGICAL_EXAMINATION_PROCESS_OF_WOUND_MATERIAL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000146
        title: "Histopathological examination process of wound material"
        description: "A wound diagnostic process in which tissue taken from a wound is fixed, sectioned, stained and examined microscopically to determine its cellular and structural characteristics."
      EXCESSIVE_COLLAGEN_DEPOSITION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000154
        title: "Excessive collagen deposition process"
        description: "A scarring process in which collagen is laid down in excess of the amount needed to replace the tissue lost in the wound, yielding a raised scar."
        aliases: ["Hypertrophic scarring process"]
      KELOID_DEVELOPMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000171
        title: "Keloid development process"
        description: "A pathological scarring process in which collagen is deposited beyond the margins of the original wound into the surrounding skin, yielding a raised scar that extends past the wound boundaries."
      PROCESS_OF_ADMINISTERING_A_LOCAL_ANESTHETIC_AGENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000176
        title: "Process of administering a local anesthetic agent"
        description: "A process of drug administration in which a material entity bearing a local anesthetic drug role participates."
      MECHANICAL_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000190
        title: "Mechanical wound debridement process"
        description: "A debridement process in which non-viable tissue, debris and foreign material are removed from a wound by physical force applied to the wound bed, without cutting and without enzymatic, autolytic or biological action."
      MICROBIAL_ANALYSIS_OF_THE_WOUND_SWAB_FOR_WOUND_PATHOGENS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000202
        title: "Microbial analysis of the wound swab for wound pathogens"
        description: "A diagnostic process to assess wound characteristics in which a specimen collected from the wound with a swab is examined in a laboratory to detect and identify microorganisms that participate in wound infection."
      NUTRITIONAL_STATUS_IMPROVEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000216
        title: "Nutritional status improvement process"
        description: "A wound treatment process in which the dietary or supplementary nutrient intake of a patient who has a wound is changed with the aim of correcting a deficiency or imbalance of nutrients in the patient's body."
      PLANIMETRY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000236
        title: "Planimetry"
      POSTOPERATIVE_WOUND_CONTROL_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000243
        title: "Postoperative wound control process"
        description: "A wound diagnostic process in which a surgical wound is inspected and assessed after the operation that created it, to monitor its healing and to detect wound complications."
      PRESSURE_IMPACT_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000245
        title: "Pressure impact process in wound development"
      WOUND_HEALING_BY_PRIMARY_INTENTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000248
        title: "Wound healing by primary intention process"
        description: "A wound healing in which the directly approximated edges of a wound with little tissue loss join together, so that the wound closes with minimal granulation tissue formation and leaves a narrow scar."
        aliases: ["Wound healing by primary intention"]
      REGENERATIVE_WOUND_HEALING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000260
        title: "Regenerative wound healing process"
        description: "A wound healing in which the tissue lost in the wound is replaced by newly formed tissue of the same type, restoring the original tissue architecture and function without scar formation."
        aliases: ["Regenerative wound healing"]
      TISSUE_REPAIR_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000263
        title: "Tissue repair process"
        description: "A wound healing related physiological process in which damaged or lost tissue is replaced by newly formed tissue, by regeneration, by scar formation or both, so that the continuity of the injured tissue is restored."
      PATHOLOGICAL_SCARRING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000269
        title: "Pathological scarring process"
        description: "A disorder development process in which the fibrous tissue laid down during wound repair is deposited in excess or in a disorganized way, and that has as output an abnormal scar."
      WOUND_HEALING_BY_SECONDARY_INTENTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000274
        title: "Wound healing by secondary intention process"
        description: "A wound healing in which the wound edges are not approximated and the tissue defect is closed by the formation of granulation tissue, wound contraction and epithelialization."
        aliases: ["Wound healing by secondary intention"]
      SKIN_COLOR_ASSESSMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000284
        title: "Skin color assessment process"
        description: "A wound diagnostic process in which the hue of the skin in and around the wound is inspected and that has as specified output a datum about that hue."
      SMOKING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000289
        title: "Smoking"
        description: "A process in which a person inhales and exhales the smoke produced by burning tobacco or another plant material."
      WOUND_ODOR_ASSESSMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000291
        title: "Wound odor assessment process"
        description: "A wound diagnostic process that examines the presence, intensity and character of the odor emanating from a wound and has as specified output a datum about that wound odor."
      SURGICAL_TREATMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000298
        title: "Surgical treatment process"
        description: "A disease disorder treatment process in which the disease or disorder is treated by an operative manual and instrumental intervention on the patient's body, such as incision, excision, manipulation or repair of tissue."
      SURGICAL_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000299
        title: "Surgical wound debridement process"
        description: "A debridement process in which necrotic, devitalized or infected tissue and foreign material are removed from a wound by sharp excision with surgical instruments."
      TAKING_A_WOUND_SWAB:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000306
        title: "Taking a wound swab"
        description: "A diagnostic process to assess wound characteristics in which a swab is passed over the wound bed to collect a specimen of wound material for laboratory examination."
      WOUND_HEALING_BY_TERTIARY_INTENTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000308
        title: "Wound healing by tertiary intention process"
        description: "A wound healing in which the wound is initially left open and only closed surgically after a delay, with healing proceeding after this delayed primary closure."
        aliases: ["Wound healing by tertiary intention"]
      TRAUMA_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000338
        title: "Trauma process"
        description: "A process in which a sudden external mechanical force acts on a tissue."
      ULTRASOUND_ASSISTED_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000350
        title: "Ultrasound-assisted wound debridement process"
        description: "A debridement process in which devitalized tissue, debris and biofilm are detached from a wound bed by ultrasonic energy transmitted through a fluid applied to the wound."
      WATER_JET_ASSISTED_WOUND_DEBRIDEMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000377
        title: "Water-jet assisted wound debridement process"
        description: "A debridement process in which devitalized tissue and debris are cut away from a wound and removed by a high-velocity jet of sterile liquid."
      WOUND_CLEANSING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000387
        title: "Wound cleansing process"
        description: "A wound treatment process in which non-adherent material, exudate and microorganisms are removed from the wound surface and surrounding skin by rinsing or wiping with a cleansing solution, without excising tissue."
      WOUND_CLOSURE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000388
        title: "Wound closure process"
        description: "A wound treatment process that brings the edges of a wound into apposition or covers the wound defect with tissue, so that the wound is no longer open."
      WOUND_CONTRACTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000391
        title: "Wound contraction process"
        description: "A wound healing related physiological process in which myofibroblasts in the granulation tissue draw the wound edges centripetally toward each other, reducing the area of the open wound."
      WOUND_DIAGNOSTIC_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000395
        title: "Wound diagnostic process"
        description: "A disease diagnostic process that is directed at a wound of a patient and assesses whether it is present and what its nature and characteristics are."
      WOUND_DOCUMENTATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000397
        title: "Wound documentation process"
        description: "A planned process in which observations and findings about a wound of a patient are recorded in an information artifact."
      WOUND_EDGE_PROTECTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000402
        title: "Wound edge protection process"
        description: "A wound treatment process in which the wound edge is shielded from agents and forces that would damage it, such as exudate or adhesive stripping."
      WOUND_HEALING_RELATED_PHYSIOLOGICAL_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000409
        title: "Wound healing related physiological process"
        description: "A biological_process that occurs in an organism after tissue injury and is part of the restoration of the integrity of the injured tissue."
      WOUND_INFECTION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000410
        title: "Wound infection process"
        description: "A course of the disease process in which pathogenic microorganisms invade and multiply in the tissue of a wound and elicit a host response."
      WOUND_IRRIGATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000411
        title: "Wound irrigation process"
        description: "A wound treatment process in which a flow of liquid is applied to a wound to rinse debris, exudate and microorganisms from its surface."
      WOUND_DEVELOPMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000414
        title: "Wound development process"
        description: "A disorder development process in which a wound comes into being in a patient through disruption of the continuity of body tissue."
      WOUND_PALPATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000416
        title: "Wound palpation"
        description: "A diagnostic process to assess wound characteristics in which an examiner touches and presses the wound and the surrounding tissue with the hands to perceive their physical properties."
      WOUND_DEVELOPMENT_SUBPROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000418
        title: "Wound development subprocess"
        description: "A process that has the newly developed wound as a participant or output and does so with near certainty."
      WOUND_SIZE_MEASUREMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000419
        title: "Wound size measurement process"
        description: "A wound diagnostic process that has as specified output a wound depth measurement datum."
      WOUND_TEMPERATURE_ASSESSMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000422
        title: "Wound temperature assessment process"
        description: "A wound diagnostic process that has as specified output a datum about the temperature of the wound bed or of the periwound skin."
      WOUND_TREATMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000423
        title: "Wound treatment process"
        description: "A disease disorder treatment process that has as participant a wound and is directed at that wound's healing or management."
      WOUND_VOLUMETRICS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000425
        title: "Wound volumetrics"
        description: "A wound size measurement process that has as specified output a datum about the volume of the wound cavity."
      WOUND_DEHISCENCE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000433
        title: "Wound dehiscence process"
        description: "A disorder development process in which previously approximated wound edges separate."
      SCARRING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000471
        title: "Scarring process"
        description: "A wound healing related physiological process in which fibrous connective tissue replaces tissue lost in a wound, yielding a scar rather than restoration of the original tissue architecture."
      MALIGNANT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000514
        title: "Malignant process"
        description: "A disease course process that has as participant a malignancy."
      MALIGNANT_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000515
        title: "Malignant process in wound development"
        description: "A malignant process that is a wound development subprocess."
      TRAUMA_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000516
        title: "Trauma process in wound development"
        description: "A trauma process that is a wound development subprocess."
      ACIDITY_IMPACT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000517
        title: "Acidity impact process"
        description: "A process in which an acid or a base acts on a tissue."
      HEAT_IMPACT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000518
        title: "Heat impact process"
        description: "A process in which heat acts on a tissue."
      PRESSURE_IMPACT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000519
        title: "Pressure impact process"
        description: "A process in which sustained mechanical pressure acts on a tissue."
        aliases: ["Sustained mechanical load"]
      DIABETES_MELLITUS_TYPE_II_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000520
        title: "Diabetes mellitus type II disease process"
        description: "A diabetes mellitus disease process of a diabetic metabolic disorder of type II."
      IRREVERSIBLY_DIMINISHED_MICROVASCULAR_PERFUSION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000521
        title: "Irreversibly diminished microvascular perfusion process"
        description: "A process in which the perfusion of a tissue through its microvasculature is reduced without recovery."
      ANGIOPATHIC_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000522
        title: "Angiopathic disease process"
        description: "A disease course process of an angiopathy."
      AUTOIMMUNE_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000523
        title: "Autoimmune disease process"
        description: "A disease course process of an autoimmune tissue disorder."
      DIABETES_MELLITUS_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000535
        title: "Diabetes mellitus disease process"
        description: "A disease course process of a diabetic metabolic disorder."
      DIABETES_MELLITUS_TYPE_I_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000536
        title: "Diabetes mellitus type I disease process"
        description: "A diabetes mellitus disease process of a diabetic metabolic disorder of type I."
      ANGIOPATHIC_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000537
        title: "Angiopathic disease process in wound development"
        description: "An angiopathic disease process that is a wound development subprocess."
      AUTOIMMUNE_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000538
        title: "Autoimmune disease process in wound development"
        description: "An autoimmune disease process that is a wound development subprocess."
      DIABETES_MELLITUS_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000539
        title: "Diabetes mellitus disease process in wound development"
        description: "A diabetes mellitus disease process that is a wound development subprocess."
      VENOUS_INSUFFICIENCY_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000540
        title: "Venous insufficiency disease process"
        description: "A course of the disease process that has as participant a venous insufficiency disorder."
      VENOUS_INSUFFICIENCY_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000541
        title: "Venous insufficiency disease process in wound development"
        description: "A venous insufficiency disease process that is a wound development subprocess."
      PERIPHERAL_ARTERIAL_OCCLUSIVE_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000542
        title: "Peripheral arterial occlusive disease process"
        description: "An angiopathic disease process that has as participant a peripheral arterial occlusive disease."
      PERIPHERAL_ARTERIAL_OCCLUSIVE_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000543
        title: "Peripheral arterial occlusive disease process in wound development"
        description: "A peripheral arterial occlusive disease process that is a wound development subprocess."
      IMPAIRED_WOUND_HEALING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000544
        title: "Impaired wound healing process"
        description: "A wound healing that deviates from the normal orderly and timely sequence of healing phases, such that restoration of tissue integrity is delayed, arrested or yields abnormal tissue."
        aliases: ["Pathological wound healing process"]
      NEUROPATHIC_DISEASE_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000560
        title: "Neuropathic disease process in wound development"
        description: "A neuropathic disease process that is a wound development subprocess."
      BACTERIAL_COLONIZATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000566
        title: "Bacterial colonization process"
        description: "A process in which bacteria adhere to and multiply on the surface of or within a tissue of a host organism."
      PRESSURE_OFFLOADING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000568
        title: "Pressure offloading process"
        description: "A wound treatment process that realizes a pressure redistribution function, in which mechanical load on the wound site is reduced or removed."
      BACTERIAL_CULTURE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000572
        title: "Bacterial culture process"
        description: "A wound diagnostic process in which a specimen taken from a wound is incubated in a growth medium so that bacteria present in it multiply and can be detected and identified."
      VASCULAR_ASSESSMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000573
        title: "Vascular assessment process"
        description: "A wound diagnostic process that evaluates the condition of the blood vessels supplying or draining the body region in which a wound is located."
      ANKLE_BRACHIAL_INDEX_MEASUREMENT_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000574
        title: "Ankle-brachial index measurement process"
        description: "A vascular assessment process that has as specified output the ratio of the systolic blood pressure measured at the ankle to the systolic blood pressure measured at the arm."
      WOUND_PHOTOGRAPHY_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000575
        title: "Wound photography process"
        description: "A wound documentation process in which a photographic image of a wound is produced as a record of its appearance."
      PROCESS_OF_DRUG_ADMINISTRATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000579
        title: "Process of drug administration"
        description: "A process in which a material entity bearing a clinical drug role is introduced into or applied onto the body of a patient."
      NEUROPATHIC_DISEASE_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000586
        title: "Neuropathic disease process"
        description: "A course of the disease process that has as participant a peripheral nervous system disease (peripheral neuropathy)."
      FOREIGN_BODY_PROCESS_IN_WOUND_DEVELOPMENT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000587
        title: "Foreign body process in wound development"
        description: "A wound development subprocess in which a foreign body participates."
      ANTIBIOTIC_ADMINISTRATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000589
        title: "Antibiotic administration process"
        description: "A process of drug administration in which a material entity bearing an antibiotic drug role participates."
      INFLAMMATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000590
        title: "Inflammation process"
        description: "A wound healing related physiological process in which, in response to tissue injury, local blood vessels dilate and become more permeable and leukocytes migrate into the wound to clear debris and microorganisms."
      WOUND_DRESSING_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120013
        title: "Wound dressing process"
        description: "A wound treatment process in which a wound dressing is applied to or renewed on a wound."
      WOUND_CLASSIFICATION_PROCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120015
        title: "Wound classification process"
        description: "A disease classification process that has as specified output a wound classification result."
  ProcessBoundaryTerm:
    description: >-
