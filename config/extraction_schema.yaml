      FIBRIN_COATING_OF_THE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000108
        title: "Fibrin coating of the wound"
        description: "A material entity consisting of a layer of fibrin, formed from fibrinogen in wound exudate, that adheres to the surface of a wound bed."
      FIBRIN_COVERED_WOUND_BED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000109
        title: "Fibrin-covered wound bed"
        description: "A wound base that bears the quality fibrin-covered."
      FISTULA:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000110
        title: "fistula"
