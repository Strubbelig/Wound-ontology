        description: "A wound gel/ointment/cream that is an alginate hydrogel containing the enzymes glucose oxidase and lactoperoxidase."
      FOURNIER_S_GANGRENE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000115
        title: "Fournier's gangrene"
        description: "A material disease entity that is a necrotizing infection of the fascia and soft tissues of the perineal, genital or perianal region."
      FRICTION_BUBBLE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000116
        title: "Friction bubble"
        description: "A material disease entity that is a fluid-filled cleft within the epidermis formed by repeated frictional shear forces acting on the skin."
      FULL_THICKNESS_SKIN_GRAFT:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000117
        title: "Full-thickness skin graft"
