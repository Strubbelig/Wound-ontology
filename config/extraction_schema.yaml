        title: "Hypertrophic scar"
      WOUND_COMPLICATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000557
        title: "Wound complication"
        description: "A material complication disease entity that has as part a wound complication disorder."
      SEPSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000558
        title: "Sepsis"
      OSTEOMYELITIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000559
        title: "Osteomyelitis"
      PRESSURE_REDISTRIBUTION_MATTRESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000570
        title: "Pressure redistribution mattress"
      THERAPEUTIC_FOOTWEAR:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000571
        title: "Therapeutic footwear"
      WOUND_COMPLICATION_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000588
        title: "Wound complication disorder"
        description: "A pathological disorder that is the output of a process in the course of a wound: the disorder-level counterpart of a wound complication (MILD_120053's pattern). Wound dehiscence is one; the disorders of a surgical site infection are others."
      PATHOGEN_WITH_WOUND_INFECTING_TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120019
        title: "pathogen with wound infecting tendency"
        description: "A pathogen that bears a wound infecting tendency."
      NECROSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_120020
        title: "Necrosis"
