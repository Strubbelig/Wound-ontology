        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120021
        title: "disorder development process"
        description: "A process that has as output a pathological disorder and that has as its end boundary a threshold crossing event."
      DISEASE_DIAGNOSIS_PROCESS_BY_MEASUREMENT:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120025
        title: "disease diagnosis process by measurement"
        description: "A disease diagnostic process that has as specified input a measurement datum and a disease threshold specification and that has as specified output a confirmed diseases diagnostic result by objective criteria."
