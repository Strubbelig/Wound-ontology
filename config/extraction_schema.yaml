      DEGREE_OF_WOUND_PAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000415
        title: "degree of wound pain"
        description: "A quality that inheres in a patient, that is the extent of the pain that patient feels, and that is causally influenced by a wound."
        aliases: ["Wound pain"]
      DEGREE_OF_MACERATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000434
        title: "degree of maceration"
        description: "A quality of a wound edge that is the extent to which its tissue has been softened by prolonged exposure to moisture."
      MACERATED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000435
        title: "macerated"
        description: "A degree of maceration that qualifies its bearer as macerated."
      DEGREE_OF_TISSUE_FIRMNESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000450
        title: "degree of tissue firmness"
        description: "A quality of a bodily tissue that is the degree of resistance it offers to deformation."
      DEGREE_OF_SKIN_ADHERENCE_TO_UNDERLYING_TISSUE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000451
        title: "degree of skin adherence to underlying tissue"
        description: "A quality of skin that is the extent to which it remains attached to the tissue beneath it."
      DEGREE_OF_GRANULATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000452
        title: "degree of granulation"
        description: "A quality of a wound base that is the extent to which it is covered by granulation tissue."
      DEGREE_OF_NECROSIS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000453
        title: "degree of necrosis"
        description: "A quality of a wound base that is the extent to which its tissue is necrotic."
      DEGREE_OF_FIBRIN_COVERAGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000454
        title: "degree of fibrin coverage"
        description: "A quality of a wound base that is the extent to which it is covered by fibrin."
      DEGREE_OF_EPITHELIALIZATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000455
        title: "degree of epithelialization"
        description: "A quality of a wound base that is the extent to which it has been covered by new epithelium."
      REDDENED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000456
        title: "reddened"
        description: "A color that qualifies its bearer as reddened."
      LIVID:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000457
        title: "livid"
        description: "A color that qualifies its bearer as livid."
      SOFTENED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000458
        title: "softened"
        description: "A tissue firmness that qualifies its bearer as softened."
      UNDERMINED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000459
        title: "undermined"
        description: "A degree of skin adherence that qualifies its bearer as undermined."
      GRANULATING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000460
        title: "granulating"
        description: "A degree of granulation that qualifies its bearer as granulating."
      NECROTIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000461
        title: "necrotic"
        description: "A degree of necrosis that qualifies its bearer as necrotic."
      FIBRIN_COVERED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000462
        title: "fibrin-covered"
        description: "A degree of fibrin coverage that qualifies its bearer as fibrin-covered."
      EPITHELIALIZED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000463
        title: "epithelialized"
        description: "A degree of epithelialization that qualifies its bearer as epithelialized."
      PAINFUL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000474
        title: "painful"
        description: "A degree of wound pain that qualifies its bearer as painful."
      DEGREE_OF_TIME_AFTER_DISEASE_INCEPTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000475
        title: "degree of time after disease inception"
        description: "A quality of a pathological disorder that is the time that has elapsed since the disorder came into existence, taken relative to the course expected for a disorder of its kind."
      ACUTE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000476
        title: "acute"
        description: "A degree of time after disease inception that qualifies its bearer as acute: the disorder is of recent onset and still within the period in which an orderly course is expected."
      CHRONIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000477
        title: "chronic"
        description: "A degree of time after disease inception that qualifies its bearer as chronic: the disorder has persisted beyond the period in which an orderly course is expected."
      DEGREE_OF_MICROBIAL_BURDEN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000478
        title: "degree of microbial burden"
        description: "A quality of a wound that is the extent to which microorganisms are present in it, multiply in it and elicit a response from its bearer."
      CONTAMINATED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000479
        title: "contaminated"
        description: "A degree of microbial burden that qualifies its bearer as contaminated: microorganisms are present in the wound but are not multiplying."
      INFECTED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000480
        title: "infected"
        description: "A degree of microbial burden that qualifies its bearer as infected: microorganisms are present in the wound, multiply in it and elicit a host response."
      STERILE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000486
        title: "sterile"
        description: "A degree of microbial burden that qualifies its bearer as sterile: no viable microorganisms are present in the wound."
      DEGREE_OF_TISSUE_PERFUSION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000487
        title: "degree of tissue perfusion"
        description: "A quality of a wound that is the extent to which its tissue is supplied with blood."
      ISCHEMIC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000488
        title: "ischemic"
        description: "A degree of tissue perfusion that qualifies its bearer as ischemic: the blood supply to the tissue is insufficient for its metabolic needs."
      COLONIZED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000512
        title: "colonized"
        description: "A degree of microbial burden that qualifies its bearer as colonized: microorganisms are present in the wound and multiply in it, without invading its tissue or eliciting a host response."
