      ELASTIC_BANDAGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000097
        title: "Elastic bandage"
        description: "A fixing bandage made of a material that can be stretched lengthwise and returns to its original length when released."
      EPITHELIALIZING_WOUND_BED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000101
        title: "Epithelializing wound bed"
        description: "A wound base that bears the quality epithelialized."
      FAT_GAUZE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000107
        title: "Fat gauze"
