        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120028
        title: "course of the disease process"
        description: "A process that has as participant a material disease entity, that is immediately causally downstream of a disorder development process, and that has as its start boundary a threshold crossing event."
