      CLEAN_WOUND_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000068
        title: "Clean wound according to CDC"
        description: "A wound with microbial burden assessed according to CDC that is an uninfected operative wound in which no inflammation is encountered and the respiratory, alimentary, genital or urinary tract is not entered."
      CLOSED_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000071
        title: "Closed drain"
