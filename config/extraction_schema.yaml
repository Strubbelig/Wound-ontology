      MRSA_INFECTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000447
        title: "MRSA infection"
        description: "A material disease entity that is an infection whose causal agent is a methicillin-resistant strain of Staphylococcus aureus."
      NEOPLASM:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000464
        title: "Neoplasm"
        description: "A material disease entity that has as part an abnormal mass of tissue arising from autonomous, uncoordinated proliferation of its constituent cells."
      MALIGNANCY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000465
        title: "Malignancy"
        description: "A neoplasm whose constituent cells are disposed to invade surrounding tissue or to metastasize."
      ANGIOPATHY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000466
        title: "Angiopathy"
        description: "A pathological disorder consisting in an abnormal structure of the wall or of the lumen of one or more blood vessels, such that perfusion of the tissue those vessels supply is reduced."
      DIABETIC_METABOLIC_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000467
        title: "Diabetic metabolic disorder"
        description: "A pathological disorder consisting in the abnormal organization of the insulin-secreting or insulin-responsive tissues of a patient, such that glucose homeostasis is not maintained."
      VENOUS_INSUFFICIENCY_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000468
        title: "Venous insufficiency disorder"
        description: "A pathological disorder consisting in an abnormal structure of the valves or walls of the veins of a limb, such that venous return from that limb against gravity is impaired."
      AUTOIMMUNE_TISSUE_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000469
        title: "Autoimmune tissue disorder"
        description: "A pathological disorder consisting in tissue of a patient that has been damaged by an immune response directed against constituents normally present in that patient's own body."
      LYMPHOCELE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000470
        title: "Lymphocele"
        description: "A pathological disorder consisting in a collection of lymphatic fluid within a non-epithelialised cavity in a bodily structure."
      ABSCESS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000472
        title: "Abscess"
        description: "A pathological disorder consisting in a localized collection of purulent material within a bodily structure, surrounded by inflamed and granulating tissue."
      MUCOSAL_BLISTER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000473
        title: "Mucosal blister"
        description: "A pathological disorder that is part of a mucosa and consists in a fluid-filled separation of the epithelium of that mucosa from the tissue beneath it."
      WOUND_WITH_MICROBIAL_BURDEN_ASSESSED_ACCORDING_TO_IWII:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000481
        title: "Wound with microbial burden assessed according to IWII"
        description: "A wound whose microbial burden is assessed on the IWII wound infection continuum: it bears the quality sterile, contaminated, colonized or infected."
      FIRST_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000482
        title: "First-degree burn wound"
        description: "A thermal wound in which the injury is confined to the epidermis."
      SECOND_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000483
        title: "Second-degree burn wound"
        description: "A thermal wound in which the injury extends through the epidermis into the dermis."
        aliases: ["2nd degree burn"]
      THIRD_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000484
        title: "Third-degree burn wound"
        description: "A thermal wound in which the injury extends through the full thickness of the skin."
      FOURTH_DEGREE_BURN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000485
        title: "Fourth-degree burn wound"
        description: "A thermal wound in which the injury extends beyond the skin into underlying tissue such as fascia, muscle or bone."
      OPEN_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000504
        title: "Open wound"
        description: "A wound that bears the quality open: its surface is breached, so that underlying tissue is exposed."
      CLOSED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000505
        title: "Closed wound"
        description: "A wound that bears the quality closed: the skin or mucosal surface over the injured tissue is intact."
      EPITHELIALIZED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000506
        title: "Epithelialized wound"
        description: "A wound that bears the quality epithelialized: its surface has been covered by newly formed epithelium."
        aliases: ["Healed wound"]
      LARGE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000507
        title: "Large wound"
        description: "A wound that bears the quality increased size: its extent is greater than is typical for a wound of its kind."
      DEEP_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000508
        title: "Deep wound"
        description: "A wound that bears the quality increased depth: it extends further into the tissue than is typical for a wound of its kind."
      ISCHEMIC_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000509
        title: "Ischemic wound"
        description: "An arterial insufficiency wound that bears the quality ischemic."
      ARTERIAL_INSUFFICIENCY_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000510
        title: "Arterial insufficiency wound"
        description: "A wound that is the output of a wound development process that has as part a wound causing process of the course of a peripheral arterial occlusive disease: a complication of that disorder. No claim is made that the disorder caused the wound."
        aliases: ["arterial insufficiency ulcer"]
      COLONIZED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000511
        title: "Colonized wound"
        description: "A wound with recognized microbial burden that bears the quality colonized."
      WOUND_WITH_MICROBIAL_BURDEN_ASSESSED_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000524
        title: "Wound with microbial burden assessed according to CDC"
        description: "A wound that is classified by the CDC surgical wound classification: clean, clean-contaminated, contaminated or dirty, according to the state of the operative field."
      CONTAMINATED_WOUND_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000525
        title: "Contaminated wound according to CDC"
        description: "A wound with microbial burden assessed according to CDC that is an open, fresh, accidental wound, or an operative wound with a major break in sterile technique or gross spillage from the gastrointestinal tract."
      DIRTY_WOUND_ACCORDING_TO_CDC:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000526
        title: "Dirty wound according to CDC"
        description: "A wound with microbial burden assessed according to CDC that is an old traumatic wound with retained devitalized tissue, or one that involves existing clinical infection or perforated viscera."
      CLEAN_WOUND_ACCORDING_TO_IWII:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000527
        title: "Clean wound according to IWII"
        description: "A wound with microbial burden assessed according to IWII that bears the quality sterile."
        aliases: ["Aseptic wound"]
      PRESSURE_ULCER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000534
        title: "Pressure ulcer"
        description: "A wound that is the output of a wound development process that has as part a wound causing pressure impact process."
        aliases: ["decubitus ulcer"]
      GROUP_A_STREPTOCOCCUS:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000547
        title: "Group A Streptococcus"
      VANCOMYCIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000548
        title: "Vancomycin"
      DIABETIC_FOOT_ULCER:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000549
        title: "Diabetic foot ulcer"
        description: "A diabetic wound that is located in a foot."
      SURGICAL_SITE_INFECTION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000550
        title: "Surgical site infection"
      SOFT_TISSUE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000551
        title: "Soft tissue wound"
      LACERATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000552
        title: "Laceration"
      ACUTE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000553
        title: "Acute wound"
      FOREIGN_BODY_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000554
        title: "Foreign body wound"
        description: "A wound that is the output of a wound development process that has as part a wound causing foreign body process."
      FOREIGN_BODY:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000555
        title: "Foreign body"
      HYPERTROPHIC_SCAR:
