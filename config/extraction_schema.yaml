      GAUZE_BANDAGE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000120
        title: "Gauze bandage"
        description: "A fixing bandage that is a roll of thin, loosely woven or knitted fabric with an open mesh."
      GRANULATING_WOUND_BED:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000131
        title: "Granulating wound bed"
        description: "A wound base that bears the quality granulating."
      GRAVITY_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000133
        title: "Gravity drain"
        description: "A passive drain that conducts fluid out of a wound by gravitational flow into a collecting receptacle positioned below the level of the wound."
      HEMATOMA:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000141
        title: "Hematoma"
        description: "A material disease entity consisting of a localized accumulation of blood that has escaped from blood vessels into a tissue, an organ or a body space."
      HIGH_VACUUM_DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000145
        title: "High-vacuum drain"
        description: "An active drain that draws fluid out of a wound by means of high negative pressure held in a sealed, evacuated collection container."
      HORIZONTAL_MATTRESS_SUTURE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000147
        title: "Horizontal mattress suture"
        description: "A suture in situ in which each stitch crosses the wound twice, entering and leaving the skin on both sides of the wound, so that the exposed thread segments lie parallel to the wound edge and the knot lies on one side of the wound."
      HUMAN_BITE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000148
        title: "Human bite wound"
        description: "A bite wound inflicted by the teeth of a human."
      HYDROCOLLOID_CONTAINING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000149
        title: "Hydrocolloid containing wound dressing"
        description: "A wound dressing that has as part a hydrocolloid, a hydrophilic colloidal material held in an adhesive matrix that forms a gel on contact with wound exudate."
      HYDROFIBER_CONTAINING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000150
        title: "Hydrofiber-containing wound dressing"
        description: "A wound dressing that has as part a hydrofiber, a nonwoven layer of gelling carboxymethylcellulose fibres that absorb wound exudate and turn into a cohesive gel."
      HYDROGEL_CONTAINING_WOUND_DRESSING:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000151
        title: "Hydrogel containing wound dressing"
        description: "A wound dressing that has as part a hydrogel, a cross-linked network of hydrophilic polymers with a high water content."
      HYPERGRANULATION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000153
        title: "Hypergranulation"
        description: "A material disease entity consisting of granulation tissue in a wound bed that has proliferated above the level of the surrounding skin surface."
      IMMUNOSUPPRESSION:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000161
        title: "Immunosuppression"
      INCISION_FOIL:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000162
        title: "Incision foil"
        description: "A material entity that is an adhesive polymer film applied to the skin over a surgical site, through which the surgical incision is made."
      INFECTED_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000163
