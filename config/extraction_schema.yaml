  TendencyTerm:
    description: >-
      Existing Tendency classes in MILD/WONT. Ground to one of these when the
      term already exists; leave empty when it is genuinely new.
    permissible_values:
      TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120005
        title: "tendency"
        description: "A realizable entity that inheres in a material entity and that, in virtue of the physical makeup of its bearer, inclines that bearer toward participating in processes of a certain type — such that the inclination raises the objective probability of, but does not necessitate, the occurrence of those processes; that may be counteracted or reinforced by other tendencies of the same bearer without thereby ceasing to exist; and that may be realized to varying degrees, or not at all."
      GENETIC_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120008
        title: "genetic predisposition"
        description: "A disease predisposition that has as material basis a pathogenic genetic variant."
      PREDISPOSITION_FROM_AN_EXISTING_DISORDER:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120010
        title: "predisposition from an existing disorder"
        description: "A disease predisposition that inheres in a Homo sapiens that has as part a pathological disorder."
      REALIZED_DISEASE_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120014
        title: "realized disease predisposition"
        description: "A disease predisposition that is realized by a disorder development process."
      DISEASE_PREDISPOSITION:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120023
        title: "disease predisposition"
        description: "A tendency inhering in a person, grounded in a material basis, whose realization may produce a target pathological disorder."
        aliases: ["Predisposition / risk proper"]
      PERPETUATION_TENDENCY:
        meaning: https://bioportal.bioontology.org/ontologies/MILD/MILD_120034
        title: "perpetuation tendency"
