      ANTISEPTIC_DYE:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000020
        title: "Antiseptic dye"
        description: "A material used for wound treatment that is a coloured compound that stains the tissue it is applied to and bears the antiseptic drug role."
