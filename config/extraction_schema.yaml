      DIABETIC_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000088
        title: "Diabetic wound"
        description: "A wound that is the output of a wound development process that has as part a process of the course of a diabetic metabolic disorder. No claim is made that the disorder caused the wound."
      DOG_BITE_WOUND:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000091
        title: "Dog bite wound"
        description: "A bite wound that was inflicted by the teeth of a dog."
      DRAIN:
        meaning: https://bioportal.bioontology.org/ontologies/WONT/WONT_0000093
        title: "Drain"
